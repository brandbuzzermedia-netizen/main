                    <input class="input sm src" data-f="research.hiringRoles.${j}.source" value="${h.source}" placeholder="Source and date" aria-label="Source">
                    <button class="btn sm ghost" data-action="hiring-remove" data-id="${l.id}" data-i="${j}" aria-label="Remove role">×</button></div>`)}
                  <div class="row between"><button class="btn sm" data-action="hiring-add" data-id="${l.id}">${icon('plus')}Add role</button><div data-live="hiring-summary" data-id="${l.id}">${PV.live['hiring-summary']({ dataset: { id: l.id } })}</div></div>
                </div></div>` : ''}
            </div>`)}
            <div class="rsec"><div class="h"><h3>Sources</h3><span class="hint">Links you used, so the founder can check.</span></div><div class="form"><div class="field full"><textarea class="textarea" data-f="research.sources" rows="2" placeholder="One link per line">${l.research.sources || ''}</textarea></div></div></div>
            ${E.has(l.founderInsight) ? html`<div class="rsec"><div class="h"><h3>Founder insight</h3></div><div class="card-b small">${l.founderInsight}</div></div>` : ''}
            <div class="sticky-actions">
              ${done ? html`<span class="badge b-green">Research complete</span><a class="btn dark" href="#/email/${l.id}">${icon('mail')}Generate email</a>`
                : html`<button class="btn dark" data-action="research-done" data-id="${l.id}" ${hasSignal ? '' : 'title="Add at least one signal first"'}>${icon('check')}Mark research complete</button><span class="small muted">${hasSignal ? 'You can still edit afterwards.' : 'Add at least one observed signal first.'}</span>`}
              <a class="btn ghost" href="#/lead/${l.id}" style="margin-left:auto">Open lead</a>
            </div>
          </div>
          <div class="stack">
            <div class="card"><div class="card-h"><h2>Opportunities</h2><span class="sub">Updates as you type</span></div>
              <div class="card-b"><div class="legend mb"><span><span class="tag fact">Fact</span> What you observed, word for word</span><span><span class="tag inference">Inference</span> What it could indicate</span><span><span class="tag hypothesis">Hypothesis</span> Where Point Vision might help. Confirm before claiming it</span></div>
              <div data-live="opportunities" data-id="${l.id}">${PV.live.opportunities({ dataset: { id: l.id } })}</div></div></div>
            <div class="card"><div class="card-h"><h2>Lead score</h2></div><div class="card-b" data-live="score-parts" data-id="${l.id}">${PV.live['score-parts']({ dataset: { id: l.id } })}</div></div>
          </div>
        </div>`;
    }
  };

  Object.assign(PV.actions, {
    'hiring-add': (el) => PV.mutate(el.dataset.id, (l) => { l.research.hiringRoles = l.research.hiringRoles || []; l.research.hiringRoles.push({ role: '', count: '', source: '' }); }),
    'hiring-remove': (el) => PV.mutate(el.dataset.id, (l) => { l.research.hiringRoles.splice(Number(el.dataset.i), 1); }),
    'research-done': (el) => {
      const l = S.lead(el.dataset.id);
      if (!E.signalEntries(l).length) { U.toast('Add at least one observed signal first', 'err'); return; }
      if (['new', 'researching'].includes(l.status)) PV.setStatus(l.id, 'researchComplete', { silent: true });
      PV.mutate(l.id, (x) => { PV.stamp(x, 'researched'); });
      U.toast('Research marked complete');
    }
  });
})();
</script>
<script>/* Email Generator: components, three variations, editor with live checks. */
(function () {
  'use strict';
  const PV = window.PV, E = PV.E, U = PV.U, S = PV.S;
  const { html, icon } = U;

  const VNAMES = { A: 'Version A · Direct', B: 'Version B · Insight-led', C: 'Version C · Founder-to-founder' };
  const VDESC = { A: 'Short and highly concise', B: 'Opens with a business or technical observation', C: 'More conversational and personal' };
  PV.VNAMES = VNAMES;

  // Make sure a lead has generated outreach; never overwrites edits.
  PV.ensureOutreach = (l) => {
    if (l.outreach && l.outreach.variants) return { ok: true };
    const gen = E.generateOutreach(l, PV.settings, { seed: 0 });
    if (gen.blocked) return { ok: false, reason: gen.reason };
    const k = PV.settings.outreach.tone || 'C';
    l.outreach = { variants: gen.variants, components: gen.components, variant: k, subject: gen.variants[k].subject, body: gen.variants[k].body,
      angle: gen.angle, signal: gen.signal, primary: gen.primary.field, seed: 0, generatedAt: gen.generatedAt, edited: false };
    S.saveLead(l, { silent: true });
    return { ok: true };
  };

  PV.regenerate = (id, opts) => {
    const l = S.lead(id);
    const o = l.outreach || {};
    const go = () => PV.mutate(id, (x) => {
      const seed = (o.seed || 0) + 1;
      const primary = (opts && opts.primary) || o.primary;
      const gen = E.generateOutreach(x, PV.settings, { seed, primary });
      if (gen.blocked) { U.toast(gen.reason, 'err'); return; }
      const k = o.variant || PV.settings.outreach.tone || 'C';
      x.outreach = Object.assign({}, o, { variants: gen.variants, components: gen.components, variant: k, subject: gen.variants[k].subject, body: gen.variants[k].body,
        angle: gen.angle, signal: gen.signal, primary: gen.primary.field, seed, generatedAt: gen.generatedAt, edited: false });
      PV.log(x, 'Email regenerated');
    });
    if (o.edited && !(opts && opts.force)) U.confirmBox('Replace your edits?', 'Regenerating rewrites all three variations and replaces the edited draft.', 'Regenerate', go);
    else go();
  };

  PV.live.lint = (el) => {
    const l = S.lead(el.dataset.id);
    if (!l || !l.outreach) return '';
    const res = E.lintEmail(l.outreach.body, l, PV.settings);
    const out = PV.settings.outreach;
    return html`<div class="row between mb"><span class="strong">${res.words} words</span><span class="small muted">Target ${out.minWords}–${out.maxWords}</span></div>
      <div class="progress ${res.words >= out.minWords && res.words <= out.maxWords ? 'green' : 'coral'} mb"><i style="width:${Math.min(100, Math.round(res.words * 100 / out.maxWords))}%"></i></div>
      <div class="lint">${res.issues.length ? res.issues.map((i) => html`<div class="i ${i.level}">${i.text}</div>`) : html`<div class="i ok">Specific opening, right length, no banned phrases, no numbers that aren't in the research.</div>`}</div>`;
  };

  PV.emailEditor = (l, opts) => {
    const o = l.outreach;
    return html`<div data-lead="${l.id}" class="stack-sm">
      <div class="field"><label for="em-subj">Subject</label><input class="input" id="em-subj" data-f="outreach.subject" value="${o.subject}" data-edit></div>
      <div class="field"><label for="em-body">Email${o.edited ? ' (edited)' : ''}</label><textarea class="textarea email" id="em-body" data-f="outreach.body" data-edit>${o.body}</textarea></div>
      ${opts && opts.noLint ? '' : html`<div data-live="lint" data-id="${l.id}">${PV.live.lint({ dataset: { id: l.id } })}</div>`}
    </div>`;
  };
  // Any manual edit marks the draft as edited so regenerate asks first.
  document.addEventListener('input', (e) => {
    if (e.target.dataset && e.target.dataset.edit !== undefined) {
      const host = e.target.closest('[data-lead]');
      const l = host && S.lead(host.dataset.lead);
      if (l && l.outreach) l.outreach.edited = true;
    }
  });

  function variantsHtml(l) {
    const o = l.outreach;
    return html`<div class="variants">${['A', 'B', 'C'].map((k) => {
      const v = o.variants[k];
      return html`<button class="variant ${o.variant === k ? 'on' : ''}" data-action="pick-variant" data-id="${l.id}" data-k="${k}">
        <div class="vh"><span class="strong">${VNAMES[k]}</span><span class="badge b-line" style="margin-left:auto">${v.words} words</span></div>
        <div class="tiny muted">${VDESC[k]}</div>
        <div class="subj">${v.subject}</div>
        <div class="vb">${v.body}</div>
        <span class="btn sm ${o.variant === k ? 'dark' : ''}" style="align-self:flex-start">${o.variant === k ? 'Selected' : 'Use this version'}</span>
      </button>`;
    })}</div>`;
  }

  PV.views.email = {
    render(r) {
      const filter = PV.prefs.pickerFilter || 'open';
      const list = PV.pickerList(r.id, filter).filter(({ l }) => filter === 'all' || ['researchComplete', 'drafted', 'review', 'researching'].includes(l.status) || l.id === r.id);
      const l = r.id ? S.lead(r.id) : (list.find((x) => ['researchComplete', 'drafted'].includes(x.l.status)) || list[0] || {}).l;
      if (!l) return html`<div class="page-head"><div><h1>Email Generator</h1></div></div><div class="card"><div class="empty"><h3>No leads ready for outreach</h3><p>Complete research on a lead first.</p></div></div>`;
      if (!r.id) history.replaceState(null, '', '#/email/' + l.id);
      const ready = PV.ensureOutreach(l);
      const opps = E.analyze(l, PV.settings);
      const head = html`<div class="page-head"><div><h1>Email Generator</h1><p class="sub">Built only from this lead's research and your Settings. Opening line quotes a real observation. Founder-to-founder, 60–120 words, no generic filler.</p></div></div>`;
      if (!ready.ok) {
        return html`${head}<div class="grid g-work">${PV.picker('email', l.id, list, filter)}<div class="card"><div class="card-h">${PV.whoLine(l)}</div><div class="empty"><h3>Nothing to personalise from yet</h3><p>${ready.reason}</p><a class="btn dark mt" href="#/research/${l.id}">${icon('research')}Open research</a></div></div></div>`;
      }
      const o = l.outreach;
      const c = o.components;
      const locked = ['approved', 'sent'].includes(l.status) || E.STAGE_BY_KEY[l.status].index > E.STAGE_BY_KEY.approved.index;
      return html`${head}
        <div class="grid g-work">
          ${PV.picker('email', l.id, list, filter)}
          <div class="stack">
            <div class="card">
              <div class="card-h">${PV.whoLine(l)}<div class="right">${U.statusBadge(l.status)}${U.scoreBadge(PV.score(l))}</div></div>
              <div class="card-b">
                <div class="row wrap mb"><label class="lbl-sm" for="lead-with">Lead with signal</label>
                  <select class="select sm" id="lead-with" data-onchange="lead-with" data-id="${l.id}" style="width:auto;max-width:100%">${opps.map((x) => PV.opt(x.field, o.primary, `${x.fieldLabel} · ${x.confidence}: ${E.shortFact(x.fact, 9)}`))}</select>
                  <button class="btn sm" data-action="regen" data-id="${l.id}" style="margin-left:auto">${icon('refresh')}Regenerate</button></div>
                <dl class="comp">
                  <dt>1 · Personalization hook</dt><dd><span class="tag fact">Fact</span> ${c.hook}</dd>
                  <dt>2 · Problem hypothesis</dt><dd><span class="tag hypothesis">Hypothesis</span> ${c.problem}</dd>
                  <dt>3 · Point Vision relevance</dt><dd>${c.relevance}</dd>
                  <dt>4 · Value proposition</dt><dd>${c.value}</dd>
                  <dt>5 · CTA</dt><dd>${c.cta}</dd>
                </dl>
              </div>
            </div>
            <div><h2 style="margin-bottom:10px">6 · Complete email: three variations</h2>${variantsHtml(l)}</div>
          </div>
          <div class="stack">
            <div class="card">
              <div class="card-h"><h2>Selected draft</h2><span class="sub">${VNAMES[o.variant] || ''}</span></div>
              <div class="card-b">${PV.emailEditor(l)}</div>
              <div class="sticky-actions">
                ${locked ? html`<span class="small muted">Already ${E.STAGE_BY_KEY[l.status].label.toLowerCase()}. Edits are still saved.</span>`
                  : html`<button class="btn" data-action="save-draft" data-id="${l.id}">${icon('save')}Save draft</button>
                  <button class="btn dark" data-action="submit-review" data-id="${l.id}" ${l.status === 'review' ? 'disabled' : ''}>${icon('send')}${l.status === 'review' ? 'With founder' : 'Submit for founder review'}</button>`}
                <button class="btn ghost" data-action="copy-email" data-id="${l.id}">${icon('copy')}Copy</button>
              </div>
            </div>
          </div>
        </div>`;
    }
  };

  Object.assign(PV.actions, {
    'regen': (el) => PV.regenerate(el.dataset.id),
    'lead-with': (el) => PV.regenerate(el.dataset.id, { primary: el.value }),
    'pick-variant': (el) => {
      const l = S.lead(el.dataset.id);
      const go = () => PV.mutate(l.id, (x) => {
        const v = x.outreach.variants[el.dataset.k];
        Object.assign(x.outreach, { variant: el.dataset.k, subject: v.subject, body: v.body, edited: false });
      });
      if (l.outreach.edited && l.outreach.variant !== el.dataset.k) U.confirmBox('Switch version?', 'Your edits to the current draft will be replaced.', 'Switch', go);
      else go();
    },
    'save-draft': (el) => {
      PV.mutate(el.dataset.id, (l) => { if (E.STAGE_BY_KEY[l.status].index < E.STAGE_BY_KEY.drafted.index) { l.status = 'drafted'; } PV.stamp(l, 'researched'); PV.stamp(l, 'drafted'); });
      U.toast('Draft saved');
    },
    'submit-review': (el) => {
      const l = S.lead(el.dataset.id);
      const lint = E.lintEmail(l.outreach.body, l, PV.settings);
      const doIt = () => {
        PV.mutate(l.id, (x) => { PV.stamp(x, 'researched'); PV.stamp(x, 'drafted'); x.status = 'review'; PV.stamp(x, 'submitted'); x.founderNoteResolved = true; });
        U.toast('Submitted for founder review');
        const next = PV.leads.find((x) => x.status === 'researchComplete' || x.status === 'drafted');
        if (next) PV.go('#/email/' + next.id);
      };
      if (!lint.ok) U.confirmBox('Submit with problems?', lint.issues.filter((i) => i.level === 'error').map((i) => i.text).join(' '), 'Submit anyway', doIt);
      else doIt();
    },
    'copy-email': (el) => {
      const l = S.lead(el.dataset.id);
      U.copy(`Subject: ${l.outreach.subject}\n\n${l.outreach.body}`, 'Email');
    }
  });
})();
</script>
<script>/* Founder Review: one prospect at a time. The founder is the final decision-maker. */
(function () {
  'use strict';
  const PV = window.PV, E = PV.E, U = PV.U, S = PV.S;
  const { html, icon } = U;

  const queue = () => PV.leads.filter((l) => l.status === 'review').map((l) => ({ l, sc: PV.score(l) })).sort((a, b) => b.sc.total - a.sc.total).map((x) => x.l);

  function nextAfter(id) {
    const q = queue().filter((l) => l.id !== id);
    return q[0] || null;
  }

  PV.views.review = {
    render(r) {
      const q = queue();
      let l = r.id ? S.lead(r.id) : q[0];
      const head = (sub) => html`<div class="page-head"><div><h1>Founder Review</h1><p class="sub">${sub}</p></div></div>`;
      if (!l) {
        const ready = PV.leads.filter((x) => x.status === 'approved').length;
        return html`${head('Nothing is sent without your approval.')}<div class="card"><div class="empty"><h3>Review queue is empty</h3><p>${ready ? `${ready} approved email${ready === 1 ? ' is' : 's are'} ready to send from the Founder Workspace.` : 'Drafts submitted by the intern will appear here.'}</p>
          <div class="btn-row mt" style="justify-content:center"><a class="btn dark" href="#/founder">Founder Workspace</a></div></div></div>`;
      }
      if (!r.id) history.replaceState(null, '', '#/review/' + l.id);
      PV.ensureOutreach(l);
      const idx = q.findIndex((x) => x.id === l.id);
      const sc = PV.score(l);
      const opps = E.analyze(l, PV.settings);
      const o = opps[0];
      const rs = l.research;
      const inQueue = l.status === 'review';
      const prev = idx > 0 ? q[idx - 1] : null;
      const next = idx >= 0 && idx < q.length - 1 ? q[idx + 1] : null;
      return html`
        <div class="page-head"><div><h1>Founder Review</h1><p class="sub">${inQueue ? `Prospect ${idx + 1} of ${q.length}. Highest score first.` : `This lead is ${E.STAGE_BY_KEY[l.status].label.toLowerCase()}, not in the review queue.`} Nothing is sent without your approval.</p></div>
          <div class="actions queue-nav">${prev ? html`<a class="btn" href="#/review/${prev.id}">${icon('arrowL')}Previous</a>` : ''}${next ? html`<a class="btn" href="#/review/${next.id}">Next${icon('arrowR')}</a>` : ''}</div></div>
        <div class="grid g-main-wide">
          <div class="stack">
            <div class="card">
              <div class="card-b review-head">
                <span class="avatar" style="width:48px;height:48px;font-size:16px">${U.initials(l)}</span>
                <div class="who grow"><h2>${PV.leadName(l)}</h2><div class="muted">${l.title} · <b style="color:var(--ink)">${l.company}</b> · ${l.location}</div></div>
                <div class="row">${U.priorityBadge(sc)}${U.scoreBadge(sc, true)}</div>
              </div>
              <div class="card-b" style="border-top:1px solid var(--line-2)"><dl class="kv">
                <dt>Prospect</dt><dd>${PV.leadName(l)}${l.linkedin ? html` · <a href="${l.linkedin}" target="_blank" rel="noopener">LinkedIn profile ↗</a>` : ''}</dd>
                <dt>Role</dt><dd>${U.notFound(l.title)}</dd>
                <dt>Company</dt><dd>${l.company}${l.website ? html` · <a href="${l.website}" target="_blank" rel="noopener">${l.website.replace(/^https?:\/\//, '')}</a>` : ''} · ${U.notFound(l.industry)} · ${U.notFound(l.companySize)}</dd>
                <dt>Email</dt><dd>${l.email || U.notFound('')} ${U.emailBadge(l.emailStatus)} <span class="muted small">${l.emailSource ? 'via ' + l.emailSource : ''}</span></dd>
              </dl></div>
            </div>
            <div class="card"><div class="card-h"><h2>Company research</h2><a class="btn sm ghost" href="#/research/${l.id}" style="margin-left:auto">Open research</a></div><div class="card-b"><dl class="kv">
              <dt>Description</dt><dd>${U.notFound(rs.description)}</dd>
              <dt>Products</dt><dd>${U.notFound(rs.products)}</dd>
              ${E.signalEntries(l).map((s) => html`<dt>${E.FIELD[s.field].label}</dt><dd>${s.text}</dd>`)}
              <dt>Sources</dt><dd class="small">${U.notFound(rs.sources)}</dd>
            </dl></div></div>
            <div class="card"><div class="card-h"><h2>Opportunity</h2>${o ? U.confBadge(o.confidence) : ''}</div><div class="card-b">
              ${o ? html`<div class="opp" style="border:0;padding:0">
                <div class="ln"><span class="tag fact">Fact</span><span class="strong">Observed signal.</span> ${o.fact}</div>
                <div class="ln"><span class="tag inference">Inference</span><span class="strong">Potential challenge.</span> ${o.challenge}</div>
                <div class="ln"><span class="tag hypothesis">Hypothesis</span><span class="strong">Point Vision opportunity.</span> ${o.opportunity}</div></div>
                ${opps.length > 1 ? html`<details class="more mt-sm"><summary>${opps.length - 1} more signal${opps.length > 2 ? 's' : ''}</summary>${opps.slice(1).map((x) => html`<div class="opp mt-sm"><div class="ln"><span class="tag fact">Fact</span>${x.fact}</div><div class="ln"><span class="tag hypothesis">Hypothesis</span>${x.opportunity}</div><div class="src mt-sm">${x.confidence} confidence</div></div>`)}</details>` : ''}`
                : html`<p class="notfound">Not Found</p>`}
              <div class="field mt" data-lead="${l.id}"><label for="fi">Your technical / business insight (optional)</label>
                <textarea class="textarea" id="fi" data-f="founderInsight" rows="2" placeholder="e.g. We rebuilt a similar onboarding flow last year. Mention the document intake step. Click Regenerate to work it into the email.">${l.founderInsight || ''}</textarea></div>
            </div></div>
          </div>
          <div class="stack">
            <div class="card">
              <div class="card-h"><h2>Email draft</h2><div class="right"><div class="seg">${['A', 'B', 'C'].map((k) => html`<button class="${l.outreach.variant === k ? 'on' : ''}" data-action="pick-variant" data-id="${l.id}" data-k="${k}" title="${PV.VNAMES[k]}">${k}</button>`)}</div></div></div>
              <div class="card-b">${PV.emailEditor(l)}</div>
              <div class="sticky-actions">
                <button class="btn good" data-action="approve" data-id="${l.id}">${icon('check')}Approve</button>
                <button class="btn" data-action="focus-editor">${icon('edit')}Edit</button>
                <button class="btn" data-action="regen" data-id="${l.id}">${icon('refresh')}Regenerate</button>
                <button class="btn danger" data-action="reject" data-id="${l.id}">${icon('x')}Reject</button>
                <button class="btn" data-action="review-save" data-id="${l.id}">${icon('save')}Save</button>
                <button class="btn dark" data-action="ready-to-send" data-id="${l.id}">${icon('send')}Mark Ready to Send</button>
              </div>
            </div>
            <p class="tiny muted">Approve keeps it in your send list. Mark Ready to Send approves it and opens the send step. Either way, you send it yourself from your inbox.</p>
          </div>
        </div>`;
    }
  };

  function approve(id, ready) {
    PV.mutate(id, (l) => {
      if (E.STAGE_BY_KEY[l.status].index < E.STAGE_BY_KEY.approved.index) l.status = 'approved';
      PV.stamp(l, 'submitted');
      PV.stamp(l, 'approved');
      if (ready) { l.outreach.readyToSend = true; PV.log(l, 'Marked ready to send'); }
    }, { silent: true });
  }

  Object.assign(PV.actions, {
    'approve': (el) => {
      const id = el.dataset.id;
      const next = nextAfter(id);
      approve(id);
      U.toast('Approved. Added to your send list');
      if (location.hash.startsWith('#/review')) PV.go(next ? '#/review/' + next.id : '#/review'); else PV.render();
    },
    'ready-to-send': (el) => {
      approve(el.dataset.id, true);
      U.toast('Ready to send. Send it from your inbox, then log it');
      PV.go('#/lead/' + el.dataset.id);
    },
    'review-save': (el) => { PV.mutate(el.dataset.id, () => {}); U.toast('Saved'); },
    'focus-editor': () => { const t = document.getElementById('em-body'); if (t) { t.focus(); t.scrollIntoView({ block: 'center' }); } },
    'reject': (el) => {
      const id = el.dataset.id;
      const l = S.lead(id);
      const ov = U.modal(html`<form id="rej"><div class="mh"><h2>Reject ${PV.leadName(l)}</h2><button type="button" class="x-btn" data-action="close-modal" aria-label="Close">×</button></div>
        <div class="mb stack-sm">
          <label class="check"><input type="radio" name="mode" value="back" checked><div><div class="t">Send back to the intern</div><div class="tiny muted">Needs more research or a better draft. Your note shows on their queue.</div></div></label>
          <label class="check"><input type="radio" name="mode" value="lost"><div><div class="t">Disqualify</div><div class="tiny muted">Not a fit. Moves the lead to Lost.</div></div></label>
          <div class="field mt-sm"><label for="rej-note">Note</label><textarea class="textarea" id="rej-note" name="note" placeholder="e.g. Signal is 8 months old. Find something recent." autofocus></textarea></div>
        </div>
        <div class="mf"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn danger" type="submit">Reject</button></div></form>`, { center: true });
      ov.querySelector('#rej').addEventListener('submit', (e) => {
        e.preventDefault();
        const mode = e.target.mode.value;
        const note = e.target.note.value.trim();
        const next = nextAfter(id);
        PV.mutate(id, (x) => {
          if (mode === 'lost') { x.status = 'lost'; PV.stamp(x, 'lost'); PV.log(x, 'Disqualified in founder review' + (note ? ': ' + note : '')); }
          else { x.status = 'researching'; x.founderNote = note || 'Rejected in review. Needs another pass.'; x.founderNoteResolved = false; PV.log(x, 'Sent back by founder' + (note ? ': ' + note : '')); }
        }, { silent: true });
        U.closeModal();
        U.toast(mode === 'lost' ? 'Disqualified' : 'Sent back to intern');
        if (location.hash.startsWith('#/review')) PV.go(next ? '#/review/' + next.id : '#/review'); else PV.render();
      });
    },
    'mark-sent': (el) => {
      PV.mutate(el.dataset.id, (l) => {
        l.status = 'sent'; PV.stamp(l, 'approved'); PV.stamp(l, 'sent'); l.linkedinChecklist.emailSent = true;
      }, { silent: true });
      U.toast('Logged as sent. LinkedIn follow-up is next');
      PV.go('#/lead/' + el.dataset.id);
    }
  });
})();
</script>
<script>/* Kanban pipeline with drag-and-drop (and a stage menu on touch screens). */
(function () {
  'use strict';
  const PV = window.PV, E = PV.E, U = PV.U, S = PV.S;
  const { html, icon } = U;

  function daysIn(l) {
    const m = l.milestones[E.STAGE_BY_KEY[l.status].milestone] || l.updatedAt;
    const d = Math.floor((Date.now() - new Date(m).getTime()) / 86400000);
    return d <= 0 ? 'today' : d + 'd';
  }

  PV.views.pipeline = {
    render() {
      const q = (PV.prefs.pipeQ || '').toLowerCase();
      const leads = PV.leads.filter((l) => !q || [PV.leadName(l), l.company, l.title, l.industry].join(' ').toLowerCase().includes(q));
      const today = PV.today();
      const open = PV.leads.filter((l) => !['won', 'lost', 'notInterested'].includes(l.status)).length;
      return html`
        <div class="page-head"><div><h1>Pipeline</h1><p class="sub">${open} open · ${PV.leads.filter((l) => l.status === 'won').length} won. Drag cards between stages. On a phone, use the stage menu on each card.</p></div>
          <div class="actions"><div class="search">${icon('search')}<input class="input" id="pipe-q" placeholder="Filter cards…" value="${PV.prefs.pipeQ || ''}" aria-label="Filter pipeline"></div></div></div>
        <div class="kanban" id="kanban">${E.STAGES.map((s) => {
          const items = leads.filter((l) => l.status === s.key).map((l) => ({ l, sc: PV.score(l) })).sort((a, b) => b.sc.total - a.sc.total);
          return html`<section class="kcol" data-stage="${s.key}" aria-label="${s.label}">
            <div class="kh">${U.statusBadge(s.key)}<span class="n">${items.length}</span></div>
            <div class="kb">${items.map(({ l, sc }) => {
              const fu = E.nextFollowUp(l, PV.settings);
              return html`<article class="kcard" draggable="true" data-id="${l.id}">
                <a href="#/lead/${l.id}" style="text-decoration:none"><div class="nm">${PV.leadName(l)}</div><div class="co">${l.title} · ${l.company}</div></a>
                <div class="ft">${U.scoreBadge(sc)}${fu ? html`<span class="badge ${fu.due <= today ? 'b-coral' : ''}" title="Next follow-up">FU ${U.dueLabel(fu.due)}</span>` : ''}<span class="age" title="Time in this stage">${daysIn(l)}</span></div>
                <div class="move"><select class="select sm" data-onchange="status-select" data-id="${l.id}" aria-label="Move ${PV.leadName(l)} to stage">${E.STAGES.map((x) => PV.opt(x.key, l.status, x.label))}</select></div>
              </article>`;
            })}</div>
          </section>`;
        })}</div>`;
    },
    mount(root) {
      const kb = root.querySelector('#kanban');
      if (PV._kanbanScroll) kb.scrollLeft = PV._kanbanScroll;
      kb.addEventListener('scroll', () => { PV._kanbanScroll = kb.scrollLeft; });
      const qEl = root.querySelector('#pipe-q');
      qEl.addEventListener('input', () => {
        PV.prefs.pipeQ = qEl.value; PV.savePrefs();
        clearTimeout(PV._pq);
        PV._pq = setTimeout(() => { PV.render(); const n = document.getElementById('pipe-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 180);
      });
      let dragId = null;
      kb.addEventListener('dragstart', (e) => {
        const c = e.target.closest('.kcard');
        if (!c) return;
        dragId = c.dataset.id;
        c.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragId);
      });
      kb.addEventListener('dragend', (e) => { const c = e.target.closest('.kcard'); if (c) c.classList.remove('dragging'); kb.querySelectorAll('.over').forEach((x) => x.classList.remove('over')); });
      kb.addEventListener('dragover', (e) => {
        const col = e.target.closest('.kcol');
        if (!col || !dragId) return;
        e.preventDefault();
        kb.querySelectorAll('.over').forEach((x) => { if (x !== col) x.classList.remove('over'); });
        col.classList.add('over');
      });
      kb.addEventListener('drop', (e) => {
        const col = e.target.closest('.kcol');
        if (!col) return;
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain') || dragId;
        dragId = null;
        const l = S.lead(id);
        if (l && l.status !== col.dataset.stage) {
          PV.setStatus(id, col.dataset.stage);
          U.toast(`${PV.leadName(l)} → ${E.STAGE_BY_KEY[col.dataset.stage].label}`);
        }
      });
    }
  };
})();
</script>
<script>/* Follow-ups: today's manual outbound tasks. Nothing here sends anything. */
(function () {
  'use strict';
  const PV = window.PV, E = PV.E, U = PV.U;
  const { html, icon } = U;

  PV.views.followups = {
    render() {
      const today = PV.today();
      const all = PV.leads.map((l) => ({ lead: l, fu: E.nextFollowUp(l, PV.settings) })).filter((x) => x.fu);
      const due = all.filter((x) => x.fu.due <= today).sort((a, b) => a.fu.due.localeCompare(b.fu.due));

        <div class="grid g-main-wide">
          <div class="stack">
            <h2>Due now</h2>

              <div class="card-h">${PV.whoLine(l)}<div class="right"><span class="badge b-coral">${U.dueLabel(fu.due)}</span></div></div>
              <div class="card-b stack-sm">
                <div class="row wrap"><span class="strong">Follow-up ${fu.n} · Day ${fu.day}</span><span class="small muted">${fu.label}</span><span class="small muted" style="margin-left:auto">First email ${U.shortDate(l.milestones.sent)}</span></div>
                <div class="small muted">Subject: ${fu.subject}</div>
                ${PV.copyBlock('due-' + l.id, fu.body, 'Follow-up')}
                <div class="btn-row">${PV.mailtoBtn(l, fu.subject, fu.body)}<button class="btn sm dark" data-action="fu-done" data-id="${l.id}" data-n="${fu.n}">${icon('check')}Mark sent</button>
                  <button class="btn sm ghost" data-action="fu-skip" data-id="${l.id}" data-n="${fu.n}">Skip</button>
                  <button class="btn sm" data-action="status" data-id="${l.id}" data-to="replied" style="margin-left:auto">They replied</button></div>
              </div></div>`) : html`<div class="card"><div class="empty"><h3>No follow-ups due</h3><p>Nice. Check the upcoming list on the right.</p></div></div>`}
          </div>
          <div class="stack">
            <div class="card"><div class="card-h"><h2>Ready to send</h2><span class="sub">Approved first emails</span></div>
              <div class="list">${ready.length ? ready.map((l) => html`<div class="li"><div class="grow"><div class="ttl">${PV.leadName(l)}</div><div class="meta">${l.company}</div>
                <div class="btn-row mt-sm">${PV.mailtoBtn(l)}<button class="btn sm" data-action="copy-email" data-id="${l.id}">${icon('copy')}Copy</button><button class="btn sm dark" data-action="mark-sent" data-id="${l.id}">Email Sent</button></div></div></div>`) : html`<div class="empty small">Nothing waiting.</div>`}</div></div>
            <div class="card"><div class="card-h"><h2>LinkedIn connection requests</h2></div>
              <div class="card-b tiny muted" style="padding-bottom:0">Default: a simple request, no pitch. Send it by hand on LinkedIn.</div>
              <div class="list">${liTodo.length ? liTodo.map((l) => html`<div class="li"><div class="grow"><div class="ttl">${PV.leadName(l)}</div><div class="meta">${l.company}</div>
                <div class="btn-row mt-sm">${l.linkedin ? html`<a class="btn sm" href="${l.linkedin}" target="_blank" rel="noopener">${icon('linkedin')}Open LinkedIn</a>` : ''}<button class="btn sm dark" data-action="li-requested" data-id="${l.id}">Request sent</button></div></div></div>`) : html`<div class="empty small">All caught up.</div>`}</div></div>
            <div class="card"><div class="card-h"><h2>Upcoming</h2></div>
              <div class="list">${upcoming.length ? upcoming.map(({ lead: l, fu }) => html`<a class="li" href="#/lead/${l.id}"><span class="grow"><span class="ttl">${PV.leadName(l)}</span><div class="meta">Follow-up ${fu.n} · ${l.company}</div></span><span class="badge">${U.shortDate(fu.due)}</span></a>`) : html`<div class="empty small">Nothing scheduled.</div>`}</div></div>

  PV.actions['li-requested'] = (el) => {
    PV.mutate(el.dataset.id, (l) => { l.linkedinChecklist.requestSent = true; PV.stamp(l, 'linkedinRequested'); });

})();
</script>
<script>/* Weekly analytics. Every number is calculated from logged activity. Nothing is estimated. */
(function () {
  'use strict';
  const PV = window.PV, E = PV.E, U = PV.U;
  const { html, icon } = U;

  const rate = (g) => `${g.replied} of ${g.sent} replied (${Math.round(g.replyRate * 100)}%)${g.positive ? ` · ${g.positive} positive` : ''}`;

  function insight(label, res, empty) {
    const t = res && res.top;
    return html`<div class="insight"><div class="k">${label}</div>
      ${t ? html`<div class="v">${t.label}</div><div class="d">${rate(t)}</div>` : html`<div class="v notfound" style="font-size:14px">${empty || 'Not enough data yet'}</div><div class="d">Needs at least one reply in this period</div>`}
      ${res && res.all.length > 1 ? html`<details class="more mt-sm"><summary>All ${res.all.length}</summary><table class="t plain small"><tbody>${res.all.map((g) => html`<tr><td>${g.label}</td><td class="num">${g.replied}/${g.sent}</td><td class="num">${Math.round(g.replyRate * 100)}%</td></tr>`)}</tbody></table></details>` : ''}
    </div>`;
  }

  PV.views.analytics = {
    render() {
      const offset = PV.prefs.weekOffset || 0;
      const scope = PV.prefs.insightScope || 'week';
      const ref = E.addDays(new Date(), offset * 7);
      const rep = E.weeklyReport(PV.leads, ref, PV.settings, scope);
      const t = rep.totals;
      const ws = E.startOfWeek(ref);
      const days = Array.from({ length: 7 }, (_, i) => E.addDays(ws, i));
      const label = `${U.shortDate(rep.from)} – ${U.shortDate(rep.to)}`;
      const I = rep.insights;
      return html`
        <div class="page-head"><div><h1>Weekly report</h1><p class="sub">${label}${offset === 0 ? ' (this week)' : ''}. Calculated only from activity logged in the app. No estimates, no benchmarks.</p></div>
          <div class="actions"><button class="btn" data-action="week" data-d="-1">${icon('arrowL')}Previous</button>${offset ? html`<button class="btn" data-action="week" data-d="0">This week</button>` : ''}<button class="btn" data-action="week" data-d="1" ${offset >= 0 ? 'disabled' : ''}>Next${icon('arrowR')}</button><button class="btn" data-action="export-week">${icon('download')}Export</button></div></div>
        <div class="kpis">
          ${[['Prospects researched', t.researched], ['Emails sent', t.sent], ['LinkedIn connections', t.connected], ['Replies', t.replies], ['Positive replies', t.positive],
            ['Meetings', t.meetings], ['Qualified opportunities', t.qualified], ['Proposals', t.proposals], ['Won deals', t.won]].map(([k, v]) => html`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div></div>`)}
        </div>

        <div class="row between mt" style="margin-top:26px;margin-bottom:10px;flex-wrap:wrap;gap:10px"><div><h2>What is working</h2><p class="small muted">${scope === 'all' ? 'All emails sent to date' : 'Emails sent this week'}: ${rep.sample}. Ranked by positive-reply rate, then reply rate.</p></div>
          <div class="seg"><button class="${scope !== 'all' ? 'on' : ''}" data-action="scope" data-v="week">This week</button><button class="${scope === 'all' ? 'on' : ''}" data-action="scope" data-v="all">All time</button></div></div>
        <div class="grid g3">
          ${insight('Top-performing industry', I.industry)}
          ${insight('Top-performing job title', I.title)}
          ${insight('Top personalization angle', I.angle)}
          ${insight('Top opportunity signal', I.signal)}
          <div class="insight"><div class="k">Most common pain point</div>${I.pain ? html`<div class="v">${I.pain.name}</div><div class="d">Seen in ${I.pain.count} of ${I.pain.of} researched lead${I.pain.of === 1 ? '' : 's'}. <span class="tag inference">Inference</span> ${I.pain.challenge}</div>` : html`<div class="v notfound" style="font-size:14px">Not enough data yet</div><div class="d">Needs completed research in this period</div>`}</div>
          ${insight('Best-performing email variation', I.variation)}
        </div>

        <div class="card mt" style="margin-top:22px"><div class="card-h"><h2>Day by day</h2></div><div class="table-wrap"><table class="t plain"><thead><tr><th>Day</th>${E.ACTIVITY.map(([, l]) => html`<th class="num">${l}</th>`)}</tr></thead><tbody>
          ${days.map((d) => { const k = E.dayKey(d); const a = E.activity(PV.leads, k, k); return html`<tr><td class="nowrap strong">${d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}</td>${E.ACTIVITY.map(([m]) => html`<td class="num ${a[m] ? '' : 'faint'}">${a[m]}</td>`)}</tr>`; })}
        </tbody></table></div></div>`;
    }
  };

  Object.assign(PV.actions, {
    'week': (el) => { const d = Number(el.dataset.d); PV.prefs.weekOffset = d === 0 ? 0 : Math.min(0, (PV.prefs.weekOffset || 0) + d); PV.savePrefs(); PV.render(); },
    'scope': (el) => { PV.prefs.insightScope = el.dataset.v; PV.savePrefs(); PV.render(); },
    'export-week': () => {
      const rep = E.weeklyReport(PV.leads, E.addDays(new Date(), (PV.prefs.weekOffset || 0) * 7), PV.settings, PV.prefs.insightScope);
      const t = rep.totals;
      const lines = [['Point Vision weekly outbound report', rep.from + ' to ' + rep.to], [], ['Metric', 'Value'],
        ['Prospects researched', t.researched], ['Emails sent', t.sent], ['LinkedIn connections', t.connected], ['Replies', t.replies], ['Positive replies', t.positive],
        ['Meetings', t.meetings], ['Qualified opportunities', t.qualified], ['Proposals', t.proposals], ['Won deals', t.won], [],
        ['Insight', 'Top', 'Replied', 'Sent']];
      [['Industry', rep.insights.industry], ['Job title', rep.insights.title], ['Personalization angle', rep.insights.angle], ['Opportunity signal', rep.insights.signal], ['Email variation', rep.insights.variation]]
        .forEach(([k, r]) => lines.push([k, r.top ? r.top.label : 'Not enough data', r.top ? r.top.replied : '', r.top ? r.top.sent : '']));
      lines.push(['Most common pain point', rep.insights.pain ? rep.insights.pain.name : 'Not enough data', rep.insights.pain ? rep.insights.pain.count : '', '']);
      U.download(`point-vision-week-${rep.from}.csv`, E.toCSV(lines), 'text/csv');
    }
  });
})();
</script>
<script>/* Settings: company profile, ICP builder, outreach rules, scoring weights,
   uploaded materials, and data management. */
(function () {
  'use strict';
  const PV = window.PV, E = PV.E, U = PV.U, S = PV.S;
  const { html, icon } = U;

  const TABS = [['company', 'Point Vision profile'], ['icp', 'Target customer (ICP)'], ['outreach', 'Outreach'], ['scoring', 'Lead scoring'], ['materials', 'Materials'], ['data', 'Data']];
  const KINDS = [['case-study', 'Case study'], ['testimonial', 'Testimonial'], ['service', 'Service information'], ['campaign', 'Past successful campaign'], ['client-result', 'Client result']];

  const lines = (path, val, rows, ph) => html`<textarea class="textarea" data-s="${path}" data-lines rows="${rows || 4}" placeholder="${ph || 'One per line'}">${(val || []).join('\n')}</textarea>`;

  function company(s) {
    const c = s.company;
    return html`<div class="card"><div class="card-h"><h2>Point Vision profile</h2><span class="sub">Used in every generated email. Keep it factual; nothing here is embellished</span></div><div class="card-b form">
      <div class="field"><label>Company name</label><input class="input" data-s="company.name" value="${c.name}"></div>
      <div class="field"><label>Website</label><input class="input" data-s="company.website" value="${c.website}"></div>
      <div class="field full"><label>Description</label><textarea class="textarea" data-s="company.description" rows="3">${c.description}</textarea></div>
      <div class="field"><label>Services</label>${lines('company.services', c.services, 9)}<span class="help">The generator matches each opportunity to one of these.</span></div>
      <div class="field"><label>Value propositions</label>${lines('company.valueProps', c.valueProps, 9)}<span class="help">Only claims you can stand behind.</span></div>
      <div class="field"><label>Sender name</label><input class="input" data-s="company.senderName" value="${c.senderName}" placeholder="e.g. Mehul"></div>
      <div class="field"><label>Sender role</label><input class="input" data-s="company.senderRole" value="${c.senderRole}"></div>
      <div class="field full"><label>Email signature (optional)</label><textarea class="textarea" data-s="company.signature" rows="3" placeholder="Leave blank to sign with name, role and company">${c.signature}</textarea></div>
    </div></div>`;
  }

  function icp(s) {
    const i = s.icp;
    const chip = (path, v, on) => html`<button type="button" class="chip ${on ? 'on' : ''}" data-action="icp-toggle" data-p="${path}" data-v="${v}">${v}</button>`;
    const allTitles = Array.from(new Set(E.TITLES.concat(i.titles)));
    return html`<div class="stack">
      <div class="card"><div class="card-h"><h2>Industries</h2></div><div class="card-b chips">${E.INDUSTRIES.map((v) => chip('industries', v, i.industries.includes(v)))}</div></div>
      <div class="card"><div class="card-h"><h2>Target job titles</h2></div><div class="card-b"><div class="chips">${allTitles.map((v) => chip('titles', v, i.titles.includes(v)))}</div>
        <div class="row mt"><input class="input" id="new-title" placeholder="Add a custom title, e.g. Chief Operating Officer" style="max-width:340px"><button class="btn" data-action="icp-add-title">Add title</button></div></div></div>
      <div class="card"><div class="card-h"><h2>Geography</h2><span class="sub">Country → State → City, or a custom location</span></div><div class="card-b">
        <div class="table-wrap"><table class="t plain"><thead><tr><th>Country</th><th>State / region</th><th>City</th><th>Custom</th><th></th></tr></thead><tbody>
        ${i.locations.map((l, n) => html`<tr>
          <td><input class="input sm" data-s="icp.locations.${n}.country" value="${l.country || ''}" placeholder="United States"></td>
          <td><input class="input sm" data-s="icp.locations.${n}.state" value="${l.state || ''}" placeholder="New York"></td>
          <td><input class="input sm" data-s="icp.locations.${n}.city" value="${l.city || ''}" placeholder="New York"></td>
          <td><input class="input sm" data-s="icp.locations.${n}.custom" value="${l.custom || ''}" placeholder="e.g. Tri-state area"></td>
          <td><button class="btn sm ghost" data-action="icp-loc-rm" data-i="${n}" aria-label="Remove location">×</button></td></tr>`)}
        </tbody></table></div><button class="btn sm mt" data-action="icp-loc-add">${icon('plus')}Add location</button>
        <p class="tiny muted mt-sm">Scoring gives full ICP location credit for a city match, partial credit for the state or country.</p></div></div>
      <div class="card"><div class="card-h"><h2>Company size</h2></div><div class="card-b chips">${E.SIZES.map((v) => chip('sizes', v, i.sizes.includes(v)))}</div></div>
      <div class="card"><div class="card-h"><h2>Default keywords</h2></div><div class="card-b"><input class="input" data-s-csv="icp.keywords" value="${(i.keywords || []).join(', ')}" placeholder="Comma-separated, used by Lead Finder"></div></div>
    </div>`;
  }

  function outreach(s) {
    const o = s.outreach;
    return html`<div class="card"><div class="card-h"><h2>Outreach rules</h2></div><div class="card-b form">
      <div class="field"><label>Daily prospect target</label><input class="input" type="number" min="1" max="100" data-s="outreach.dailyTarget" data-num value="${o.dailyTarget}"></div>
      <div class="field"><label>Email tone (default version)</label><select class="select" data-s="outreach.tone">${[['A', 'Direct: short and concise'], ['B', 'Insight-led: opens with an observation'], ['C', 'Founder-to-founder: conversational']].map(([v, t]) => PV.opt(v, o.tone, t))}</select></div>
      <div class="field"><label>CTA style</label><select class="select" data-s="outreach.ctaStyle">${Object.keys(E.CTA_STYLES).map((k) => PV.opt(k, o.ctaStyle, E.CTA_STYLES[k].label))}</select><span class="help">e.g. “${E.CTA_STYLES[o.ctaStyle] ? E.CTA_STYLES[o.ctaStyle].lines[0] : ''}”</span></div>
      <div class="field"><label>Follow-up schedule (days after first email)</label><input class="input" data-s-csv-num="outreach.followUpDays" value="${o.followUpDays.join(', ')}" placeholder="3, 7, 14"><span class="help">Three reminders: short reminder, insight, close the loop.</span></div>
      <div class="field"><label>Minimum words</label><input class="input" type="number" data-s="outreach.minWords" data-num value="${o.minWords}"></div>
      <div class="field"><label>Maximum words</label><input class="input" type="number" data-s="outreach.maxWords" data-num value="${o.maxWords}"></div>
      <div class="field full"><label>Phrases to avoid</label>${lines('outreach.avoidPhrases', o.avoidPhrases, 8)}<span class="help">Flagged in every draft. One per line.</span></div>
    </div></div>`;
  }

  function scoring(s) {
    const w = s.scoring;
    const total = Object.values(w).reduce((a, b) => a + (Number(b) || 0), 0);
    const rows = [['icp', 'ICP Fit', 'Industry and geography match the ICP'], ['decision', 'Decision Maker Fit', 'Seniority and relevance of the role'], ['opportunity', 'Opportunity Signal', 'Evidence of a technology, automation or operational opportunity'],
      ['company', 'Company Fit', 'Company size and known business characteristics'], ['personalization', 'Personalization Data', 'How much meaningful research is available'], ['timing', 'Timing Signal', 'Recent hiring, launch, expansion, funding or transformation']];
    return html`<div class="card"><div class="card-h"><h2>Lead scoring criteria</h2><span class="sub">Weights are normalised to 100 · internal prioritisation only</span><div class="right"><button class="btn sm" data-action="reset-scoring">Reset to default</button></div></div>
      <div class="card-b"><div class="table-wrap"><table class="t plain"><thead><tr><th>Criterion</th><th>What it measures</th><th class="num">Points</th></tr></thead><tbody>
      ${rows.map(([k, t, d]) => html`<tr><td class="strong nowrap">${t}</td><td class="muted">${d}</td><td class="num"><input class="input sm" style="width:80px;text-align:right" type="number" min="0" max="100" data-s="scoring.${k}" data-num data-rerender value="${w[k]}"></td></tr>`)}
      <tr><td class="strong">Total</td><td></td><td class="num strong">${total}</td></tr></tbody></table></div>
      <div class="row wrap mt"><span class="badge b-green">80–100 High Priority</span><span class="badge b-amber">60–79 Medium Priority</span><span class="badge">Below 60 Low Priority</span></div></div></div>`;
  }

  function materials(s) {
    const m = s.materials || [];
    return html`<div class="stack">
      <div class="card"><div class="card-h"><h2>Add material</h2><span class="sub">Case studies, testimonials, service info, past campaigns, client results</span></div>
        <form class="card-b form" id="mat-form">
          <div class="field"><label>Type</label><select class="select" name="kind">${KINDS.map(([v, t]) => PV.opt(v, 'case-study', t))}</select></div>
          <div class="field"><label>Industry (optional)</label><select class="select" name="industry"><option value="">Any</option>${E.INDUSTRIES.map((i) => PV.opt(i, ''))}</select></div>
          <div class="field full"><label>Title</label><input class="input" name="title" placeholder="e.g. Client onboarding automation for a wealth manager" required></div>
          <div class="field full"><label>Content</label><textarea class="textarea" name="content" rows="5" placeholder="Paste the text, or upload a .txt / .md / .csv file below."></textarea></div>
          <div class="field full"><label>Or upload a text file</label><input type="file" name="file" accept=".txt,.md,.csv,.json,text/plain"></div>
          <div class="full row"><button class="btn dark" type="submit">${icon('upload')}Save material</button><span class="tiny muted">Emails mention a case study or result only if one exists here for the same industry, by title. Nothing is invented.</span></div>
        </form></div>
      <div class="card"><div class="card-h"><h2>Library</h2><span class="sub">${m.length} item${m.length === 1 ? '' : 's'}</span></div>
        ${m.length ? html`<div class="list">${m.map((x, i) => html`<div class="li" style="align-items:flex-start"><div class="grow"><div class="row wrap"><span class="ttl">${x.title}</span><span class="badge">${(KINDS.find((k) => k[0] === x.kind) || [, x.kind])[1]}</span>${x.industry ? html`<span class="badge b-line">${x.industry}</span>` : ''}</div>
          <div class="small muted mt-sm" style="white-space:pre-wrap">${(x.content || '').slice(0, 400)}${(x.content || '').length > 400 ? '…' : ''}</div></div><button class="btn sm ghost danger" data-action="mat-rm" data-i="${i}">Remove</button></div>`)}</div>`
          : html`<div class="empty"><h3>No materials yet</h3><p>Until you add real case studies or results, outreach will not reference any.</p></div>`}
      </div></div>`;
  }

  function data() {
    const n = PV.leads.length;
    const samples = PV.leads.filter((l) => l.sample).length;
    return html`<div class="stack">
      <div class="card"><div class="card-h"><h2>Storage</h2></div><div class="card-b small stack-sm">
        ${S.mode === 'server' ? html`<p><span class="badge b-green">Shared workspace</span> Data is synced to the team server and cached in this browser.</p>`
          : html`<p><span class="badge">This browser only</span> Data is saved in this browser's local storage. To share one workspace between the intern and the founder, run <span class="mono">node server.js</span> and open the address it prints. See the README.</p>`}
        <p class="muted">${n} leads stored${samples ? `, ${samples} of them sample data` : ''}.</p></div></div>
      <div class="card"><div class="card-h"><h2>Backup</h2></div><div class="card-b btn-row">
        <button class="btn" data-action="backup">${icon('download')}Download backup (JSON)</button>
        <label class="btn">${icon('upload')}Restore from backup<input type="file" accept=".json,application/json" id="restore" hidden></label>
      </div></div>
      <div class="card"><div class="card-h"><h2>Sample data</h2></div><div class="card-b btn-row">
        <button class="btn danger" data-action="clear-sample" ${samples ? '' : 'disabled'}>Remove ${samples} sample lead${samples === 1 ? '' : 's'}</button>
        <button class="btn" data-action="load-sample">Reload sample leads</button>
      </div></div>
      <div class="card"><div class="card-h"><h2>Reset</h2></div><div class="card-b btn-row">
        <button class="btn danger" data-action="reset-all">Delete all leads and reset settings</button>
      </div></div></div>`;
  }

  PV.views.settings = {
    render(r) {
      const tab = r.id || 'company';
      const s = PV.settings;
      const body = { company, icp, outreach, scoring, materials, data }[tab] || company;
      return html`<div class="page-head"><div><h1>Settings</h1><p class="sub">Changes save automatically${S.mode === 'server' ? ' and sync to the team' : ''}.</p></div></div>
        <nav class="tabs">${TABS.map(([k, t]) => html`<a href="#/settings/${k}" class="${tab === k ? 'on' : ''}">${t}</a>`)}</nav>
        <div style="max-width:980px">${body(s)}</div>`;
    },
    mount(root) {
      root.querySelectorAll('[data-s-csv], [data-s-csv-num]').forEach((el) => el.addEventListener('change', () => {
        const isNum = el.dataset.sCsvNum !== undefined;
        const path = el.dataset.sCsv || el.dataset.sCsvNum;
        let v = el.value.split(',').map((x) => x.trim()).filter(Boolean);
        if (isNum) v = v.map(Number).filter((x) => x > 0).slice(0, 3);
        PV.setPath(S.settings, path, v);
        S.saveSettings({ silent: true });
        U.toast('Saved');
      }));
      const mf = root.querySelector('#mat-form');
      if (mf) mf.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(mf);
        let content = String(fd.get('content') || '').trim();
        const file = fd.get('file');
        if (file && file.size) {
          if (file.size > 400000) { U.toast('File is too large (max 400 KB of text)', 'err'); return; }
          content = (content ? content + '\n\n' : '') + (await file.text()).trim();
        }
        const title = String(fd.get('title') || '').trim() || (file && file.name) || '';
        if (!title) { U.toast('Add a title', 'err'); return; }
        S.settings.materials.push({ id: E.uid(), kind: fd.get('kind'), industry: fd.get('industry'), title, content, addedAt: new Date().toISOString() });
        S.saveSettings();
        U.toast('Material saved');
      });
      const rs = root.querySelector('#restore');
      if (rs) rs.addEventListener('change', async () => {
        const f = rs.files[0];
        if (!f) return;
        try {
          const d = JSON.parse(await f.text());
          if (!Array.isArray(d.leads)) throw new Error('No leads array');
          U.confirmBox('Restore backup?', `This replaces current data with ${d.leads.length} leads from ${f.name}.`, 'Restore', () => { S.replaceAll(d); U.toast('Backup restored'); }, true);
        } catch (e) { U.toast('That file is not a valid backup', 'err'); }
      });
    }
  };

  Object.assign(PV.actions, {
    'icp-toggle': (el) => {
      const list = S.settings.icp[el.dataset.p];
      const i = list.indexOf(el.dataset.v);
      if (i === -1) list.push(el.dataset.v); else list.splice(i, 1);
      S.saveSettings();
    },
    'icp-add-title': () => {
      const v = document.getElementById('new-title').value.trim();
      if (!v) return;
      if (!S.settings.icp.titles.includes(v)) S.settings.icp.titles.push(v);
      S.saveSettings();
    },
    'icp-loc-add': () => { S.settings.icp.locations.push({ country: '', state: '', city: '', custom: '' }); S.saveSettings(); },
    'icp-loc-rm': (el) => { S.settings.icp.locations.splice(Number(el.dataset.i), 1); S.saveSettings(); },
    'reset-scoring': () => { S.settings.scoring = Object.assign({}, E.DEFAULT_SETTINGS.scoring); S.saveSettings(); },
    'mat-rm': (el) => { S.settings.materials.splice(Number(el.dataset.i), 1); S.saveSettings(); },
    'backup': () => U.download(`point-vision-lead-engine-backup-${PV.today()}.json`, JSON.stringify({ app: 'pv-lead-engine', exportedAt: new Date().toISOString(), settings: S.settings, leads: S.leads }, null, 2), 'application/json'),
    'clear-sample': () => U.confirmBox('Remove sample leads?', 'All leads marked as sample data are deleted. Your own leads are kept.', 'Remove', () => {
      S.replaceAll({ settings: S.settings, leads: S.leads.filter((l) => !l.sample) }); U.toast('Sample leads removed');
    }, true),
    'load-sample': () => {
      const ids = new Set(S.leads.map((l) => l.company + l.firstName));
      const fresh = window.PVSeed.build(E, S.settings, new Date()).filter((l) => !ids.has(l.company + l.firstName));
      S.replaceAll({ settings: S.settings, leads: fresh.concat(S.leads) });
      U.toast(`${fresh.length} sample leads loaded`);
    },
    'reset-all': () => U.confirmBox('Delete everything?', 'All leads, research and drafts are deleted and settings return to defaults. Download a backup first if you might need it.', 'Delete everything', () => {
      S.replaceAll({ settings: JSON.parse(JSON.stringify(E.DEFAULT_SETTINGS)), leads: [] }); U.toast('Workspace reset');
    }, true)
  });
})();
</script>
</body>
</html>
