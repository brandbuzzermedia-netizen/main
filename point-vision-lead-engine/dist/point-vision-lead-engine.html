    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  window.PVUI = { html, raw, esc, toStr, icon, ago, shortDate, dueLabel, initials, statusBadge, emailBadge, scoreBadge, priorityBadge, confBadge, notFound, toast, copy, modal, closeModal, confirmBox, download, STATUS_COLOR };

<script>/* Persistence.
   Local mode: everything lives in this browser's localStorage.
   Shared mode: when the app is served by server.js, leads and settings are
   also synced to the server so the intern and founder see the same data.
   Merging is per lead, newest `updatedAt` wins, deletions are tombstoned. */
(function () {
  'use strict';
  const E = window.PVEngine;
  const KEY = 'pvle:data:v1';
  const SYNC_MS = 12000;

  function deepDefaults(target, defaults) {
    const out = Array.isArray(defaults) ? (Array.isArray(target) ? target : defaults.slice()) : Object.assign({}, target || {});
    if (Array.isArray(defaults)) return out;
    Object.keys(defaults).forEach((k) => {
      const d = defaults[k];
      if (out[k] === undefined || out[k] === null) out[k] = JSON.parse(JSON.stringify(d));
      else if (d && typeof d === 'object' && !Array.isArray(d)) out[k] = deepDefaults(out[k], d);
    });
    return out;
  }

  const Store = {
    mode: 'local',
    online: false,
    lastSync: null,
    data: { settings: null, settingsUpdatedAt: null, leads: [], deleted: [] },
    dirty: new Set(),
    dirtySettings: false,
    listeners: [],

    get settings() { return this.data.settings; },
    get leads() { return this.data.leads; },

    async init() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
      if (saved && saved.leads) {
        this.data = saved;
        this.data.deleted = this.data.deleted || [];
        (saved.dirty || []).forEach((id) => this.dirty.add(id));
        this.dirtySettings = !!saved.dirtySettings;
      } else {
        this.data.settings = JSON.parse(JSON.stringify(E.DEFAULT_SETTINGS));
        this.data.settingsUpdatedAt = new Date(0).toISOString();
        this.data.leads = window.PVSeed.build(E, this.data.settings, new Date());
        this.data.seeded = true;
      }
      this.data.settings = deepDefaults(this.data.settings, E.DEFAULT_SETTINGS);
      // Shared mode is available only when served by server.js.
      if (location.protocol.startsWith('http')) {
        try {
          const r = await fetch('api/health', { cache: 'no-store' });
          if (r.ok && (await r.json()).app === 'pv-lead-engine') {
            this.mode = 'server';
            const fresh = !saved;
            if (fresh) { this.data.leads = []; this.data.seeded = false; }
            await this.sync(true);
            setInterval(() => this.sync(), SYNC_MS);
            window.addEventListener('focus', () => this.sync());
          }
        } catch (e) { /* static hosting: stay local */ }
      }
      this.persist();
    },

    persist() {
      try {
        localStorage.setItem(KEY, JSON.stringify(Object.assign({}, this.data, { dirty: Array.from(this.dirty), dirtySettings: this.dirtySettings })));
      } catch (e) { console.warn('Could not save to localStorage', e); }
    },

    on(fn) { this.listeners.push(fn); },
    emit(source) { this.listeners.forEach((fn) => fn(source || 'local')); },

    lead(id) { return this.data.leads.find((l) => l.id === id) || null; },

    saveLead(lead, opts) {
      lead.updatedAt = new Date().toISOString();
      const i = this.data.leads.findIndex((l) => l.id === lead.id);
      if (i === -1) this.data.leads.unshift(lead); else this.data.leads[i] = lead;
      this.dirty.add(lead.id);
      this.persist();
      this.scheduleSync();
      if (!opts || !opts.silent) this.emit();
    },

    deleteLead(id) {
      this.data.leads = this.data.leads.filter((l) => l.id !== id);
      this.data.deleted.push({ id, at: new Date().toISOString() });
      this.dirty.add(id);
      this.persist();
      this.scheduleSync();
      this.emit();
    },

    saveSettings(opts) {
      this.data.settingsUpdatedAt = new Date().toISOString();
      this.dirtySettings = true;
      this.persist();
      this.scheduleSync();
      if (!opts || !opts.silent) this.emit();
    },

    replaceAll(data) {
      const now = new Date().toISOString();
      const old = this.data.leads.map((l) => l.id);
      this.data.settings = deepDefaults(data.settings || this.data.settings, E.DEFAULT_SETTINGS);
      this.data.settingsUpdatedAt = now;
      this.data.leads = (data.leads || []).map((l) => Object.assign(E.newLead(), l, { updatedAt: now }));
      const keep = new Set(this.data.leads.map((l) => l.id));
      old.filter((id) => !keep.has(id)).forEach((id) => this.data.deleted.push({ id, at: now }));
      old.forEach((id) => this.dirty.add(id));
      this.data.leads.forEach((l) => this.dirty.add(l.id));
      this.dirtySettings = true;
      this.persist();
      this.scheduleSync();
      this.emit();
    },

    scheduleSync() {
      if (this.mode !== 'server') return;
      clearTimeout(this._t);
      this._t = setTimeout(() => this.sync(), 700);
    },

    async sync(initial) {
      if (this.mode !== 'server' || this._syncing) return;
      this._syncing = true;
      const sentIds = Array.from(this.dirty);
      const body = {
        leads: sentIds.map((id) => this.lead(id)).filter(Boolean),
        deleted: this.data.deleted.filter((d) => this.dirty.has(d.id)),
        settings: this.dirtySettings ? this.data.settings : null,
        settingsUpdatedAt: this.data.settingsUpdatedAt
      };
      const sentAt = new Map(body.leads.map((l) => [l.id, l.updatedAt]));
      try {
        const r = await fetch('api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const server = await r.json();
        sentIds.forEach((id) => { const l = this.lead(id); if (!l || l.updatedAt === sentAt.get(id)) this.dirty.delete(id); });
        if (body.settings) this.dirtySettings = false;
        const before = JSON.stringify([this.data.leads.map((l) => l.id + l.updatedAt), this.data.settingsUpdatedAt]);
        const local = new Map(this.data.leads.map((l) => [l.id, l]));
        const merged = server.leads.map((s) => {
          const mine = local.get(s.id);
          return mine && this.dirty.has(s.id) && mine.updatedAt > s.updatedAt ? mine : s;
        });
        // Leads created locally that the server has not seen yet.
        this.data.leads.forEach((l) => { if (this.dirty.has(l.id) && !merged.find((m) => m.id === l.id)) merged.push(l); });
        merged.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
        this.data.leads = merged;
        this.data.deleted = server.deleted || [];
        if (!this.dirtySettings && server.settings) {
          this.data.settings = deepDefaults(server.settings, E.DEFAULT_SETTINGS);
          this.data.settingsUpdatedAt = server.settingsUpdatedAt;
        }
        this.online = true;
        this.lastSync = new Date();
        this.persist();
        const after = JSON.stringify([this.data.leads.map((l) => l.id + l.updatedAt), this.data.settingsUpdatedAt]);
        if (initial || before !== after) this.emit('remote');
        else this.emit('status');
      } catch (e) {
        this.online = false;
        this.emit('status');
      } finally {
        this._syncing = false;
      }
    }
  };

  window.PVStore = Store;
})();
</script>

          ${g.items.map((i) => { const c = i.count ? i.count() : 0; return html`<a href="#/${i.id}" class="${active === i.id ? 'on' : ''}">${icon(i.icon)}${i.label}${c ? html`<span class="count">${c}</span>` : ''}</a>`; })}

  }

  function syncStatus() {
    if (S.mode === 'server') {
      return html`<span class="dot ${S.online ? 'ok' : ''}"></span>${S.online ? 'Shared workspace · synced' : 'Shared workspace · offline, saving locally'}${S.lastSync ? html`<br><span class="faint">Last sync ${U.ago(S.lastSync.toISOString())}</span>` : ''}`;
    }
    return html`<span class="dot ok"></span>Saved in this browser<br><span class="faint">Run server.js to share with the team</span>`;
  }

  let renderPending = false;
  function render() {
    const r = route();
    document.body.classList.remove('nav-open');
    const app = document.getElementById('app');
    const scrollY = window.scrollY;
    const keepScroll = render._last === location.hash;
    render._last = location.hash;
    app.innerHTML = U.toStr(shell());
    const view = PV.views[r.name] || PV.views.dashboard;
    const page = document.getElementById('page');
    try {
      page.innerHTML = U.toStr(view.render(r));
      if (view.mount) view.mount(page, r);
    } catch (e) {
      console.error(e);
      page.innerHTML = U.toStr(html`<div class="card"><div class="empty"><h3>Something went wrong rendering this page</h3><p>${e.message}</p></div></div>`);
    }
    document.title = (TITLES[r.name] || 'Point Vision') + ' · Point Vision Lead Engine';
    if (keepScroll) window.scrollTo(0, scrollY); else window.scrollTo(0, 0);
    renderPending = false;
  }
  PV.render = render;

  function refreshLive() {
    document.querySelectorAll('[data-live]').forEach((el) => {
      const fn = PV.live[el.dataset.live];
      if (fn) el.innerHTML = U.toStr(fn(el));
    });
  }
  PV.refreshLive = refreshLive;

  /* ---------------- Lead operations ---------------- */

  const MILESTONE_LABEL = {
    added: 'Lead added', verified: 'Email verification recorded', researchStarted: 'Research started', researched: 'Research completed', drafted: 'Email drafted',
    submitted: 'Submitted for founder review', approved: 'Approved by founder', sent: 'Email sent (manually)',
    linkedinRequested: 'LinkedIn request sent', connected: 'LinkedIn connected', replied: 'Replied', positive: 'Positive reply',
    meeting: 'Meeting booked', qualified: 'Qualified', proposal: 'Proposal sent', won: 'Won', lost: 'Lost', notInterested: 'Not interested'
  };

  PV.log = (lead, text) => { (lead.activity = lead.activity || []).push({ at: new Date().toISOString(), text }); };
  PV.stamp = (lead, key) => {
    lead.milestones = lead.milestones || {};
    if (!lead.milestones[key]) { lead.milestones[key] = new Date().toISOString(); PV.log(lead, MILESTONE_LABEL[key] || key); }
  };

  PV.mutate = (id, fn, opts) => {
    const lead = S.lead(id);
    if (!lead) return null;
    fn(lead);
    S.saveLead(lead, opts);
    return lead;
  };

  PV.setStatus = (id, status, opts) => PV.mutate(id, (l) => {
    const stage = E.STAGE_BY_KEY[status];
    if (!stage || l.status === status) return;
    const from = l.status;
    l.status = status;
    PV.stamp(l, stage.milestone);
    if (status === 'sent') l.linkedinChecklist.emailSent = true;
    if (status === 'connected') { l.linkedinChecklist.connected = true; l.linkedinChecklist.requestSent = true; PV.stamp(l, 'linkedinRequested'); }
    if (status === 'replied') l.linkedinChecklist.replied = true;
    if (['researching', 'researchComplete', 'drafted'].includes(status) && E.STAGE_BY_KEY[from] && E.STAGE_BY_KEY[from].index > E.STAGE_BY_KEY[status].index) {
      PV.log(l, `Moved back to ${stage.label}`);
    }
    if (opts && opts.note) PV.log(l, opts.note);
  }, opts);

  PV.followupsDue = () => {
    const today = PV.today();
    return S.leads.map((l) => ({ lead: l, fu: E.nextFollowUp(l, S.settings) })).filter((x) => x.fu && x.fu.due <= today);
  };

  PV.leadName = (l) => E.fullName(l) || 'Unnamed lead';

  // Shared "who is this" header used across pages.
  PV.whoLine = (l) => html`<div class="row"><span class="avatar">${U.initials(l)}</span><div class="grow"><div class="ttl">${PV.leadName(l)}</div><div class="meta">${l.title || 'No title'} · ${l.company || 'No company'}</div></div></div>`;

  /* ---------------- Binding ---------------- */

  function setPath(obj, path, value) {
    const keys = path.split('.');
    let o = obj;
    keys.slice(0, -1).forEach((k) => { if (o[k] == null || typeof o[k] !== 'object') o[k] = {}; o = o[k]; });
    o[keys[keys.length - 1]] = value;
  }
  function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }
  PV.getPath = getPath; PV.setPath = setPath;

  function readValue(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.dataset.lines !== undefined) return el.value.split('\n').map((s) => s.trim()).filter(Boolean);
    if (el.dataset.num !== undefined) return el.value === '' ? null : Number(el.value);
    return el.value;
  }

  let saveTimer = null;
  function onBind(e) {
    const el = e.target;
    if (el.dataset.f !== undefined) {
      const host = el.closest('[data-lead]');
      if (!host) return;
      const id = host.dataset.lead;
      const lead = S.lead(id);
      if (!lead) return;
      setPath(lead, el.dataset.f, readValue(el));
      if (el.dataset.f === 'emailStatus' && el.value !== 'Unverified') PV.stamp(lead, 'verified');
      if (lead.status === 'new' && el.dataset.f.startsWith('research.') && E.has(el.value)) { lead.status = 'researching'; PV.stamp(lead, 'researchStarted'); }
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => S.saveLead(lead, { silent: true }), 250);
      lead.updatedAt = new Date().toISOString();
      refreshLive();
      if (e.type === 'change' && el.dataset.rerender !== undefined) { S.saveLead(lead, { silent: true }); render(); }
    } else if (el.dataset.s !== undefined) {
      setPath(S.settings, el.dataset.s, readValue(el));
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => S.saveSettings({ silent: true }), 300);
      refreshLive();
      if (e.type === 'change' && el.dataset.rerender !== undefined) { S.saveSettings({ silent: true }); render(); }
    }
  }

  /* ---------------- Global actions ---------------- */

  Object.assign(PV.actions, {
    'close-modal': () => U.closeModal(),
    'nav-toggle': () => document.body.classList.toggle('nav-open'),
    'set-role': (el) => { prefs.role = el.dataset.role; PV.savePrefs(); PV.go('#/' + prefs.role); },
    'go': (el) => PV.go(el.dataset.href),
    'copy': (el) => {
      const src = el.dataset.from ? document.querySelector(el.dataset.from) : null;
      const text = src ? (src.value !== undefined && src.tagName !== 'DIV' ? src.value : src.innerText) : el.dataset.text;
      U.copy(text || '', el.dataset.label);
    },
    'status': (el) => {
      PV.setStatus(el.dataset.id, el.dataset.to);
      U.toast(`Moved to ${E.STAGE_BY_KEY[el.dataset.to].label}`);
    }
  });

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-action]');
    if (a) {
      const fn = PV.actions[a.dataset.action];
      if (fn) { if (a.type !== 'checkbox') e.preventDefault(); fn(a, e); }
      return;
    }
    const row = e.target.closest('[data-href]');
    if (row && !e.target.closest('a, button, input, select, textarea, label')) PV.go(row.dataset.href);
  });
  document.addEventListener('input', onBind);
  document.addEventListener('change', (e) => {
    onBind(e);
    const a = e.target.closest('[data-onchange]');
    if (a && PV.actions[a.dataset.onchange]) PV.actions[a.dataset.onchange](a, e);
  });
  document.addEventListener('focusout', () => { if (renderPending) setTimeout(() => { if (!isEditing()) render(); }, 50); });

  function isEditing() {
    const a = document.activeElement;
    return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest('#page, .overlay');
  }

  window.addEventListener('hashchange', render);

  S.on((source) => {
    if (source === 'status') { const el = document.getElementById('sync-status'); if (el) el.innerHTML = U.toStr(syncStatus()); return; }
    if (source === 'remote' && (isEditing() || document.querySelector('.overlay'))) { renderPending = true; return; }
    render();
  });

  // Wait for every view script to register before the first render.
  document.addEventListener('DOMContentLoaded', () => S.init().then(() => {
    if (!location.hash) location.replace('#/' + (prefs.role || 'dashboard'));
    render();
  }));
})();
</script>
<script>/* Dashboard, Intern Workspace and Founder Workspace. */
(function () {
  'use strict';
  const PV = window.PV, E = PV.E, U = PV.U;
  const { html, icon } = U;

  const pct = (n, d) => (d ? Math.min(100, Math.round(n * 100 / d)) : 0);
  const bar = (n, d, cls) => html`<div class="progress ${cls || ''}"><i style="width:${pct(n, d)}%"></i></div>`;

  function sampleBanner() {
    if (!PV.leads.some((l) => l.sample) || PV.prefs.hideSample) return '';
    return html`<div class="banner sample"><span>Showing <b>sample leads</b> (fictional people and companies) so you can try the workflow. Clear them in Settings → Data when you start for real.</span>
      <span class="x nowrap"><a class="btn sm" href="#/settings/data">Settings</a> <button class="btn sm ghost" data-action="hide-sample">Hide</button></span></div>`;
  }
  PV.sampleBanner = sampleBanner;
  PV.actions['hide-sample'] = () => { PV.prefs.hideSample = true; PV.savePrefs(); PV.render(); };

  function todayStats() {
    const t = PV.today();
    return E.activity(PV.leads, t, t);
  }

  const FLOW = [
    ['Prospecting', 'added'], ['Research', 'researched'], ['Verification', 'verified'], ['Personalization', 'drafted'],
    ['Founder Review', 'submitted'], ['Email Sent', 'sent'], ['LinkedIn Follow-up', 'linkedinRequested'], ['Response', 'replied'], ['Meeting', 'meeting']
  ];

  function greeting() {
    const h = new Date().getHours();
    return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  }

  function conversionCard() {
    const conv = E.conversions(PV.leads);
    return html`<div class="card">
      <div class="card-h"><h2>Conversion Metrics</h2><span class="sub">All time, from logged activity only</span><div class="right"><a class="btn sm" href="#/analytics">Weekly report</a></div></div>
      <div class="card-b conv">${conv.map((c) => html`<div class="r">
        <div class="strong">${c.label}</div>
        ${bar(c.num, c.den, 'coral')}
        <div class="pct">${c.pct == null ? '—' : c.pct + '%'}<small>${c.num} of ${c.den}</small></div>
      </div>`)}</div>
    </div>`;
  }

  /* ---------------- Dashboard ---------------- */

  PV.views.dashboard = {
    render() {
      const a = todayStats();
      const target = PV.target();
      const review = PV.leads.filter((l) => l.status === 'review');
      const ready = PV.leads.filter((l) => l.status === 'approved');
      const due = PV.followupsDue();
      const untouched = PV.leads.filter((l) => ['new', 'researching'].includes(l.status)).sort((x, y) => PV.score(y).total - PV.score(x).total).slice(0, 5);
      const dateStr = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      return html`
        ${sampleBanner()}
        <div class="page-head"><div><h1>${greeting()}</h1><p class="sub">${dateStr}. ${target} qualified prospects a day, researched properly, reviewed by a founder and sent by hand.</p></div>
          <div class="actions"><a class="btn" href="#/finder">${icon('search')}Lead Finder</a></div></div>

        <div class="card target">
          <div><div class="lbl">Today's target</div><div class="big">${a.added}<small> / ${target}</small></div><div style="color:#a1a1aa;font-weight:600;margin-top:6px">Prospects added</div></div>
          <div><h2>${target} Target Prospects</h2>
            <p style="color:#d4d4d8;margin-top:4px">${a.added >= target ? 'Target reached for today. Keep the quality bar high.' : `${target - a.added} more to find today. Use Lead Finder to generate searches.`}</p>
            <div class="bar"><i style="width:${pct(a.added, target)}%"></i></div></div>
        </div>

        <div class="card mt">
          <div class="card-h"><h2>Today's flow</h2><span class="sub">How far today's work has moved, against the daily target of ${target}</span></div>
          <div class="flow">${FLOW.map(([label, key]) => html`<div class="st"><div class="t">${label}</div><div class="n">${a[key] || 0}</div>${bar(a[key] || 0, target, key === 'added' ? 'coral' : '')}</div>`)}</div>
        </div>

        <h2 class="mt" style="margin:22px 0 10px">Today's Activity</h2>
        <div class="kpis">
          ${[['Target', target, 'prospects / day'], ['Prospects Added', a.added], ['Research Completed', a.researched], ['Emails Drafted', a.drafted], ['Emails Approved', a.approved],
            ['Emails Sent', a.sent], ['LinkedIn Requests', a.linkedinRequested], ['Replies', a.replied], ['Positive Replies', a.positive], ['Meetings Booked', a.meeting]]
            .map(([k, v, d]) => html`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>${d ? html`<div class="d">${d}</div>` : ''}</div>`)}
        </div>

        <div class="grid g-main mt">
          ${conversionCard()}
          <div class="card">
            <div class="card-h"><h2>Needs attention</h2></div>
            <div class="list">
              <a class="li" href="#/review"><span class="grow"><span class="ttl">Founder review</span><div class="meta">Drafts waiting for approval</div></span><span class="badge ${review.length ? 'b-amber' : ''}">${review.length}</span></a>
              <a class="li" href="#/founder"><span class="grow"><span class="ttl">Ready to send</span><div class="meta">Approved, waiting to be sent by hand</div></span><span class="badge ${ready.length ? 'b-green' : ''}">${ready.length}</span></a>
              <a class="li" href="#/followups"><span class="grow"><span class="ttl">Follow-ups due</span><div class="meta">Day ${PV.settings.outreach.followUpDays.join(' / ')} reminders</div></span><span class="badge ${due.length ? 'b-coral' : ''}">${due.length}</span></a>
            </div>
            <div class="card-h" style="border-top:1px solid var(--line-2)"><h3>Highest-scoring leads not yet researched</h3></div>
            <div class="list">${untouched.length ? untouched.map((l) => html`<a class="li" href="#/research/${l.id}"><span class="avatar">${U.initials(l)}</span><span class="grow"><span class="ttl">${PV.leadName(l)}</span><div class="meta">${l.title} · ${l.company}</div></span>${U.scoreBadge(PV.score(l))}</a>`) : html`<div class="empty small">Nothing waiting for research.</div>`}</div>
          </div>
        </div>`;
    }
  };

  /* ---------------- Intern Workspace ---------------- */

  function internChecklist() {
    const t = PV.today();
    const target = PV.target();
    const isToday = (iso) => iso && E.dayKey(iso) === t;
    const added = PV.leads.filter((l) => isToday(l.milestones.added));
    const ms = (k) => PV.leads.filter((l) => isToday(l.milestones[k])).length;
    return [
      { t: `Find ${target} prospects`, n: added.length, href: '#/finder', hint: 'Lead Finder builds the Google searches' },
      { t: 'Enter prospect details', n: added.filter((l) => !E.missingCore(l).length).length, href: '#/leads?added=today', hint: 'Name, title, company, LinkedIn, industry, location' },
      { t: 'Research company', n: ms('researched'), href: '#/research', hint: 'Paste public facts only. Leave blank if not found' },
      { t: 'Find relevant signals', n: added.filter((l) => E.signalEntries(l).length > 0).length, href: '#/research', hint: 'Hiring, funding, launches, leadership, tech changes' },
      { t: 'Add email', n: added.filter((l) => E.has(l.email)).length, href: '#/leads?added=today', hint: 'Record where it came from' },
      { t: 'Record verification status', n: added.filter((l) => l.emailStatus && l.emailStatus !== 'Unverified').length, href: '#/leads?added=today', hint: 'Valid, risky, catch-all, invalid or not found' },
      { t: 'Generate personalization', n: ms('drafted'), href: '#/email', hint: 'Pick the strongest variation and tidy it' },
      { t: 'Submit for founder review', n: ms('submitted'), href: '#/email', hint: 'The founder approves before anything is sent' }
    ].map((c) => Object.assign(c, { done: c.n >= target, target }));
  }

  PV.views.intern = {
    render() {
      const list = internChecklist();
      const target = PV.target();
      const submitted = list[list.length - 1].n;
      const queue = PV.leads.filter((l) => ['new', 'researching', 'researchComplete', 'drafted'].includes(l.status))
        .map((l) => ({ l, sc: PV.score(l), step: E.nextStep(l) }))
        .sort((a, b) => (a.step.key === 'fix' ? -1 : 0) - (b.step.key === 'fix' ? -1 : 0) || b.sc.total - a.sc.total);
      const stepHref = (l, s) => s.view === 'edit' ? null : s.view === 'lead' ? `#/lead/${l.id}` : `#/${s.view}/${l.id}`;
      return html`
        ${sampleBanner()}
        <div class="page-head"><div><h1>Intern Workspace</h1><p class="sub">Your tasks for today, in order. Find, research, draft, submit. The founder handles approval and sending.</p></div>
          <div class="actions"><a class="btn" href="#/finder">${icon('search')}Open Lead Finder</a><button class="btn primary" data-action="add-lead">${icon('plus')}Add lead</button></div></div>
        <div class="grid g-main-wide">
          <div class="stack">
            <div class="card">
              <div class="card-h"><h2>My queue</h2><span class="sub">${queue.length} lead${queue.length === 1 ? '' : 's'} need${queue.length === 1 ? 's' : ''} your next step, highest score first</span></div>
              ${queue.length ? html`<div class="table-wrap"><table class="t"><thead><tr><th>Prospect</th><th>Score</th><th>Status</th><th>Next step</th></tr></thead><tbody>
                ${queue.map(({ l, sc, step }) => html`<tr data-href="#/lead/${l.id}">
                  <td><div class="who"><b>${PV.leadName(l)}</b><span>${l.title || '—'} · ${l.company || '—'}</span></div>${step.key === 'fix' ? html`<div class="small" style="color:var(--red);margin-top:4px">Founder: ${l.founderNote}</div>` : ''}</td>
                  <td>${U.scoreBadge(sc)}</td><td>${U.statusBadge(l.status)}</td>
                  <td>${stepHref(l, step) ? html`<a class="btn sm ${step.key === 'fix' ? 'danger' : 'dark'}" href="${stepHref(l, step)}">${step.label}</a>` : html`<button class="btn sm dark" data-action="edit-lead" data-id="${l.id}">${step.label}</button>`}</td>
                </tr>`)}</tbody></table></div>` : html`<div class="empty"><h3>Queue is clear</h3><p>Add today's prospects from Lead Finder to get started.</p></div>`}
            </div>
            <div class="card">
              <div class="card-h"><h2>With the founder</h2><span class="sub">Submitted and waiting for review</span></div>
              <div class="list">${PV.leads.filter((l) => l.status === 'review').map((l) => html`<a class="li" href="#/lead/${l.id}"><span class="avatar">${U.initials(l)}</span><span class="grow"><span class="ttl">${PV.leadName(l)}</span><div class="meta">${l.company} · submitted ${U.ago(l.milestones.submitted)}</div></span>${U.scoreBadge(PV.score(l))}</a>`)}</div>
              ${PV.leads.some((l) => l.status === 'review') ? '' : html`<div class="empty small">Nothing waiting on the founder.</div>`}
            </div>
          </div>
          <div class="card">
            <div class="card-h"><h2>Daily checklist</h2><div class="right"><span class="badge ${submitted >= target ? 'b-green' : 'b-dark'}">${Math.min(submitted, target)} / ${target} completed</span></div></div>
            <div class="card-b">
              <div class="progress coral mb"><i style="width:${pct(submitted, target)}%"></i></div>
              ${list.map((c) => html`<a class="check ${c.done ? 'done' : ''}" href="${c.href}" style="text-decoration:none">
                <input type="checkbox" ${c.done ? 'checked' : ''} disabled aria-label="${c.t}">
                <div class="grow" style="flex:1"><div class="row between"><span class="t">${c.t}</span><span class="small strong nowrap">${Math.min(c.n, c.target)} / ${c.target}</span></div><div class="tiny muted">${c.hint}</div></div>
              </a>`)}
              <p class="tiny muted mt">Ticks fill in automatically from what you log today.</p>
            </div>
          </div>
        </div>`;
    }
  };

  /* ---------------- Founder Workspace ---------------- */

  PV.views.founder = {
    render() {
      const review = PV.leads.filter((l) => l.status === 'review').map((l) => ({ l, sc: PV.score(l) })).sort((a, b) => b.sc.total - a.sc.total);
      const ready = PV.leads.filter((l) => l.status === 'approved');
      const due = PV.followupsDue();
      const replies = PV.leads.filter((l) => l.status === 'replied' || l.status === 'positive');
      const mins = Math.round(review.length * 2.5 + ready.length * 1.5 + due.length * 1.5);
      return html`
        ${sampleBanner()}
        <div class="page-head"><div><h1>Today's Review</h1><p class="sub">${review.length} prospect${review.length === 1 ? '' : 's'} to review · ${ready.length} ready to send · ${due.length} follow-up${due.length === 1 ? '' : 's'} due. Roughly ${mins} minutes.</p></div>
          <div class="actions">${review.length ? html`<a class="btn primary lg" href="#/review">${icon('review')}Start review (one at a time)</a>` : ''}</div></div>
        <div class="grid g-main-wide">
          <div class="stack">
            ${review.length ? review.map(({ l, sc }) => {
              const opps = E.analyze(l, PV.settings);
              const o = opps[0];
              return html`<div class="card">
                <div class="card-h">${PV.whoLine(l)}<div class="right">${U.scoreBadge(sc)}</div></div>
                <div class="card-b stack-sm">
                  <dl class="kv"><dt>Research</dt><dd>${U.notFound(l.research.description)}</dd>
                  <dt>Signal</dt><dd>${o ? html`<span class="tag fact">Fact</span> ${o.fact}` : U.notFound('')}</dd>
                  <dt>Opportunity</dt><dd>${o ? html`<span class="tag hypothesis">Hypothesis</span> ${o.opportunity}` : U.notFound('')}</dd></dl>
                  <details class="more"><summary>Email: ${l.outreach ? l.outreach.subject : 'no draft'}</summary><div class="copybox mt-sm">${l.outreach ? l.outreach.body : ''}</div></details>
                </div>
                <div class="sticky-actions" style="position:static">
                  <button class="btn good" data-action="approve" data-id="${l.id}">${icon('check')}Approve</button>
                  <a class="btn" href="#/review/${l.id}">${icon('edit')}Edit</a>
                  <button class="btn danger" data-action="reject" data-id="${l.id}">${icon('x')}Reject</button>
                </div>
              </div>`;
            }) : html`<div class="card"><div class="empty"><h3>No drafts waiting</h3><p>When the intern submits drafts, they appear here.</p></div></div>`}
          </div>
          <div class="stack">
            <div class="card">
              <div class="card-h"><h2>Ready to send</h2><span class="sub">Send from your own inbox</span></div>
              <div class="list">${ready.length ? ready.map((l) => html`<div class="li"><div class="grow"><div class="ttl">${PV.leadName(l)}</div><div class="meta">${l.company} · ${l.email || 'no email'}</div>
                <div class="btn-row mt-sm">${PV.mailtoBtn(l)}<button class="btn sm" data-action="copy-email" data-id="${l.id}">${icon('copy')}Copy</button><button class="btn sm dark" data-action="mark-sent" data-id="${l.id}">${icon('send')}Email Sent</button></div></div></div>`)
                : html`<div class="empty small">Nothing approved and unsent.</div>`}</div>
            </div>
            <div class="card">
              <div class="card-h"><h2>Follow-ups due</h2><div class="right"><a class="btn sm" href="#/followups">Open</a></div></div>
              <div class="list">${due.length ? due.slice(0, 6).map(({ lead, fu }) => html`<a class="li" href="#/followups"><span class="grow"><span class="ttl">${PV.leadName(lead)}</span><div class="meta">Follow-up ${fu.n} (day ${fu.day}) · ${lead.company}</div></span><span class="badge b-coral">${U.dueLabel(fu.due)}</span></a>`) : html`<div class="empty small">No follow-ups due.</div>`}</div>
            </div>
            <div class="card">
              <div class="card-h"><h2>Conversations</h2><span class="sub">Replied, needs a response</span></div>
              <div class="list">${replies.length ? replies.map((l) => html`<a class="li" href="#/lead/${l.id}"><span class="grow"><span class="ttl">${PV.leadName(l)}</span><div class="meta">${l.company}</div></span>${U.statusBadge(l.status)}</a>`) : html`<div class="empty small">No open conversations.</div>`}</div>
            </div>
          </div>
        </div>`;
    }
  };
})();
</script>
<script>/* Lead Finder: builds Google X-ray searches. It never scrapes or logs in anywhere.
   The intern runs the searches, reads results by hand and adds good prospects. */
(function () {
  'use strict';
  const PV = window.PV, E = PV.E, U = PV.U;
  const { html, icon } = U;

  const locStr = (l) => [l.city, l.state, l.country].filter(Boolean).join(', ') || l.custom || '';

  function fromIcp() {
    const icp = PV.settings.icp;
    return { industries: icp.industries.slice(0, 2), titles: icp.titles.slice(), locations: icp.locations.map((l) => l.city || l.state || l.country || l.custom).filter(Boolean),
      sizes: icp.sizes.slice(), keywords: (icp.keywords || []).join(', ') };
  }
  function state() {
    if (!PV.prefs.finder) PV.prefs.finder = fromIcp();
    return PV.prefs.finder;
  }

  function chips(key, options, selected, custom) {
    return html`<div class="chips">${options.map((o) => html`<button type="button" class="chip ${selected.includes(o) ? 'on' : ''}" data-action="finder-toggle" data-k="${key}" data-v="${o}">${o}</button>`)}
      ${custom ? html`<input class="input sm" style="width:160px" data-finder-add="${key}" placeholder="+ ${custom}" aria-label="${custom}">` : ''}</div>`;
  }

  PV.views.finder = {
    render() {
      const f = state();
      const icp = PV.settings.icp;
      const titleOpts = Array.from(new Set(E.TITLES.concat(icp.titles, f.titles)));
      const locOpts = Array.from(new Set(icp.locations.map((l) => l.city || l.state || l.country || l.custom).filter(Boolean).concat(f.locations)));
      const queries = E.buildQueries({ industries: f.industries, titles: f.titles, locations: f.locations, sizes: f.sizes, keywords: f.keywords.split(',').map((s) => s.trim()) });
      const used = (PV.prefs.usedQueries && PV.prefs.usedQueries.day === PV.today()) ? PV.prefs.usedQueries.list : [];
      const added = E.activity(PV.leads, PV.today()).added;
      const target = PV.target();
      const groups = ['People', 'Companies', 'Signals'];
      return html`
        <div class="page-head"><div><h1>Lead Finder</h1><p class="sub">Pick the ICP slice you want today and copy the searches into Google. Read the results yourself and add the prospects that genuinely fit.</p></div>
          <div class="actions"><button class="btn" data-action="finder-reset">Reset to ICP</button></div></div>
        <div class="grid g-main-wide">
          <div class="stack">
            <div class="card"><div class="card-b stack">
              <div class="field"><label>Industry</label>${chips('industries', E.INDUSTRIES.filter((i) => i !== 'Other'), f.industries)}<span class="help">Up to 3 are used to build searches.</span></div>
              <div class="field"><label>Location</label>${chips('locations', locOpts, f.locations, 'Add city / state / country')}<span class="help">Locations from your ICP. Type to add a custom one, then press Enter.</span></div>
              <div class="field"><label>Job title</label>${chips('titles', titleOpts, f.titles, 'Custom title')}</div>
              <div class="field"><label>Company size</label>${chips('sizes', E.SIZES, f.sizes)}<span class="help">Used on company-page searches (LinkedIn shows headcount like "51-200 employees").</span></div>
              <div class="field"><label for="fk">Keywords (optional)</label><input class="input" id="fk" data-finder-kw value="${f.keywords}" placeholder="e.g. automation, onboarding, RIA"><span class="help">Comma-separated. Each keyword must appear in the result.</span></div>
            </div></div>
            <div class="card">
              <div class="card-h"><h2>Search queries</h2><span class="sub">${queries.length} variations · ${used.length} used today</span></div>
              ${queries.length ? groups.map((g) => {
                const qs = queries.filter((q) => q.group === g);
                if (!qs.length) return '';
                return html`<div class="card-h" style="background:var(--surface-2)"><h3>${g === 'People' ? 'Find people (LinkedIn profiles)' : g === 'Companies' ? 'Find companies' : 'Find timing signals (for research)'}</h3></div>
                  ${qs.map((q) => html`<div class="query ${used.includes(q.query) ? 'used' : ''}"><div class="qtext"><div class="strong small">${q.label}${used.includes(q.query) ? html` <span class="badge b-line">used</span>` : ''}</div>${q.note ? html`<div class="tiny muted">${q.note}</div>` : ''}<code>${q.query}</code></div>
                    <div class="stack-sm"><button class="btn sm dark" data-action="copy-query" data-q="${q.query}">${icon('copy')}Copy Search Query</button><a class="btn sm" href="${q.url}" target="_blank" rel="noopener" data-action="open-query" data-q="${q.query}" data-url="${q.url}">${icon('ext')}Open in Google</a></div></div>`)}`;
              }) : html`<div class="empty"><h3>Pick at least one industry and one job title</h3></div>`}
            </div>
          </div>
          <div class="stack">
            <div class="card"><div class="card-h"><h2>Today</h2><div class="right"><span class="badge ${added >= target ? 'b-green' : 'b-dark'}">${added} / ${target} added</span></div></div>
              <div class="card-b"><div class="progress coral"><i style="width:${Math.min(100, Math.round(added * 100 / target))}%"></i></div>
              <button class="btn primary lg mt" style="width:100%" data-action="add-lead">${icon('plus')}Add a prospect you found</button>
              <p class="tiny muted mt-sm">Tip: paste the LinkedIn URL first. The name fills in, and duplicates are flagged before you save.</p></div></div>
            <div class="card"><div class="card-h"><h2>How to use the results</h2></div><div class="card-b small stack-sm">
              <div><b>1.</b> Open a search, scan titles and snippets in Google. Do not log in or use automation tools.</div>
              <div><b>2.</b> Open promising profiles yourself. Check role, company and location match the ICP.</div>
              <div><b>3.</b> Check the company has at least one recent, public signal worth mentioning. No signal, no outreach.</div>
              <div><b>4.</b> Add the prospect, then research. Quality over volume: ${target} good leads beat 50 weak ones.</div>
            </div></div>
            <div class="card"><div class="card-b tiny muted">This page only builds search strings. It does not scrape LinkedIn or Google, bypass logins, or automate any platform. All research is done by a person, by hand.</div></div>
          </div>
        </div>`;
    },
    mount(root) {
      root.querySelectorAll('[data-finder-add]').forEach((el) => el.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || !el.value.trim()) return;
        e.preventDefault();
        const f = state();
        const k = el.dataset.finderAdd;
        if (!f[k].includes(el.value.trim())) f[k].push(el.value.trim());
        PV.savePrefs(); PV.render();
        const again = document.querySelector(`[data-finder-add="${k}"]`); if (again) again.focus();
      }));
      const kw = root.querySelector('[data-finder-kw]');
      kw.addEventListener('change', () => { state().keywords = kw.value; PV.savePrefs(); PV.render(); });
    }
  };

  function markUsed(q) {
    const day = PV.today();
    if (!PV.prefs.usedQueries || PV.prefs.usedQueries.day !== day) PV.prefs.usedQueries = { day, list: [] };
    if (!PV.prefs.usedQueries.list.includes(q)) PV.prefs.usedQueries.list.push(q);
    PV.savePrefs();
  }

  Object.assign(PV.actions, {
    'finder-toggle': (el) => {
      const f = state();
      const list = f[el.dataset.k];
      const i = list.indexOf(el.dataset.v);
      if (i === -1) list.push(el.dataset.v); else list.splice(i, 1);
      PV.savePrefs(); PV.render();
    },
    'finder-reset': () => { PV.prefs.finder = fromIcp(); PV.savePrefs(); PV.render(); },
    'copy-query': (el) => { U.copy(el.dataset.q, 'Search query'); markUsed(el.dataset.q); setTimeout(PV.render, 300); },
    'open-query': (el) => { window.open(el.dataset.url, '_blank', 'noopener'); markUsed(el.dataset.q); PV.render(); }
  });
})();
</script>
<script>/* Lead database, lead form (add / edit with duplicate detection) and the
   lead detail page with outbound tracking, LinkedIn steps and follow-ups. */
(function () {
  'use strict';
  const PV = window.PV, E = PV.E, U = PV.U, S = PV.S;
  const { html, raw, icon } = U;

  const opt = (v, cur, label) => html`<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${label || v}</option>`;
  PV.opt = opt;

  PV.mailtoHref = (l, subject, body) => 'mailto:' + encodeURIComponent(l.email || '').replace(/%40/g, '@') + '?subject=' + encodeURIComponent(subject || '') + '&body=' + encodeURIComponent(body || '');
  PV.mailtoBtn = (l, subject, body, label) => {
    const o = l.outreach || {};
    return html`<a class="btn sm" href="${PV.mailtoHref(l, subject || o.subject, body || o.body)}" title="Opens a draft in your own mail app. Nothing is sent automatically.">${icon('mail')}${label || 'Open in mail app'}</a>`;
  };

  /* ---------------- Lead form ---------------- */

  function formHtml(lead, isNew) {
    const l = lead;
    const sc = PV.score(l);
    return html`<form id="lead-form" autocomplete="off">
      <div class="mh"><h2>${isNew ? 'Add lead' : 'Edit lead'}</h2><button type="button" class="x-btn" data-action="close-modal" aria-label="Close">×</button></div>
      <div class="mb">
        <div id="dupe-box"></div>
        <div class="form">
          <div class="field full"><label for="f-linkedin" class="req">LinkedIn URL</label><input class="input" id="f-linkedin" name="linkedin" value="${l.linkedin}" placeholder="https://www.linkedin.com/in/…" autofocus><span class="help">Paste it first: the name fills in from the URL if it can.</span></div>
          <div class="field"><label for="f-first" class="req">First name</label><input class="input" id="f-first" name="firstName" value="${l.firstName}"></div>
          <div class="field"><label for="f-last" class="req">Last name</label><input class="input" id="f-last" name="lastName" value="${l.lastName}"></div>
          <div class="field"><label for="f-title" class="req">Job title</label><input class="input" id="f-title" name="title" value="${l.title}" list="dl-titles"></div>
          <div class="field"><label for="f-company" class="req">Company</label><input class="input" id="f-company" name="company" value="${l.company}"></div>
          <div class="field"><label for="f-web">Company website</label><input class="input" id="f-web" name="website" value="${l.website}" placeholder="https://"></div>
          <div class="field"><label for="f-loc" class="req">Location</label><input class="input" id="f-loc" name="location" value="${l.location}" placeholder="New York, NY, United States" list="dl-locs"></div>
          <div class="field"><label for="f-ind" class="req">Industry</label><select class="select" id="f-ind" name="industry"><option value="">Select…</option>${E.INDUSTRIES.map((i) => opt(i, l.industry))}</select></div>
          <div class="field"><label for="f-size">Company size</label><select class="select" id="f-size" name="companySize"><option value="">Select…</option>${E.SIZES.map((s) => opt(s, l.companySize, s + ' employees'))}</select></div>
          <div class="field"><label for="f-email">Email</label><input class="input" id="f-email" name="email" type="email" value="${l.email}"></div>
          <div class="field"><label for="f-esrc">Email source</label><input class="input" id="f-esrc" name="emailSource" value="${l.emailSource}" list="dl-esrc" placeholder="Where did it come from?"></div>
          <div class="field"><label for="f-estat">Email verification status</label><select class="select" id="f-estat" name="emailStatus">${E.EMAIL_STATUSES.map((s) => opt(s, l.emailStatus))}</select></div>
          <div class="field"><label for="f-status">Lead status</label><select class="select" id="f-status" name="status">${E.STAGES.map((s) => opt(s.key, l.status, s.label))}</select></div>
          <div class="field full"><label for="f-notes">Research notes</label><textarea class="textarea" id="f-notes" name="notes" placeholder="Anything worth remembering. Detailed research goes in the Research workspace.">${l.notes}</textarea></div>
          <div class="field"><label>Lead score</label><div class="row">${U.scoreBadge(sc)}<span class="small muted">Calculated ${sc.calculated} / 100 from ICP fit and research</span></div></div>
          <div class="field"><label for="f-override">Manual score (optional)</label><input class="input" id="f-override" name="scoreOverride" type="number" min="0" max="100" value="${l.scoreOverride == null ? '' : l.scoreOverride}" placeholder="Leave blank to use calculated"></div>
        </div>
        <datalist id="dl-titles">${E.TITLES.concat(PV.settings.icp.titles).filter((v, i, a) => a.indexOf(v) === i).map((t) => html`<option value="${t}">`)}</datalist>
        <datalist id="dl-esrc">${E.EMAIL_SOURCES.map((t) => html`<option value="${t}">`)}</datalist>
        <datalist id="dl-locs">${PV.settings.icp.locations.map((x) => html`<option value="${[x.city, x.state, x.country].filter(Boolean).join(', ')}">`)}</datalist>
      </div>
      <div class="mf">
        ${isNew ? '' : html`<button type="button" class="btn danger" data-action="delete-lead" data-id="${l.id}" style="margin-right:auto">${icon('trash')}Delete</button>`}
        <button type="button" class="btn" data-action="close-modal">Cancel</button>
        ${isNew ? html`<button type="submit" class="btn" data-next="another">Save &amp; add another</button>` : ''}
        <button type="submit" class="btn dark" data-next="research">${isNew ? 'Save &amp; research' : 'Save'}</button>
      </div>
    </form>`;
  }

  function nameFromLinkedIn(url) {
    const slug = E.normLinkedIn(url);
    if (!slug || slug.includes('.') || slug.includes('/')) return null;
    const parts = decodeURIComponent(slug).split('-').filter((p) => /^[a-z]+$/i.test(p) && p.length > 1);
    if (parts.length < 2) return null;
    const cap = (s) => s[0].toUpperCase() + s.slice(1).toLowerCase();
    return { first: cap(parts[0]), last: cap(parts[parts.length - 1]) };
  }

  function readForm(form) {
    const d = {};
    new FormData(form).forEach((v, k) => { d[k] = typeof v === 'string' ? v.trim() : v; });
    d.scoreOverride = d.scoreOverride === '' ? null : Number(d.scoreOverride);
    return d;
  }

  PV.openLeadForm = (id) => {
    const existing = id ? S.lead(id) : null;
    const draft = existing ? JSON.parse(JSON.stringify(existing)) : E.newLead({ location: '', industry: (PV.settings.icp.industries || [])[0] || '' });
    if (!existing) draft.industry = '';
    const ov = U.modal(formHtml(draft, !existing));
    const form = ov.querySelector('#lead-form');
    let submitter = 'research';
    let autoName = null;
    const checkDupes = () => {
      const d = Object.assign({ id: draft.id }, readForm(form));
      const dupes = E.findDuplicates(d, PV.leads);
      const box = form.querySelector('#dupe-box');
      box.innerHTML = dupes.length ? U.toStr(html`<div class="dupe mb"><b>Possible duplicate.</b> ${dupes.map((x) => html`<div><a href="#/lead/${x.lead.id}" data-action="close-modal-go" data-href="#/lead/${x.lead.id}">${PV.leadName(x.lead)} · ${x.lead.company}</a> matches on ${x.reasons.join(', ')} (${U.statusBadge(x.lead.status)})</div>`)}<div class="tiny" style="margin-top:4px">You can still save if this is genuinely a different person.</div></div>`) : '';
      return dupes;
    };
    form.addEventListener('input', (e) => {
      if (e.target.name === 'linkedin') {
        const n = nameFromLinkedIn(e.target.value);
        const untouched = (!form.firstName.value && !form.lastName.value) || (autoName && form.firstName.value === autoName.first && form.lastName.value === autoName.last);
        if (n && untouched) { form.firstName.value = n.first; form.lastName.value = n.last; autoName = n; }
      }
      checkDupes();
    });
    form.querySelectorAll('[type=submit]').forEach((b) => b.addEventListener('click', () => { submitter = b.dataset.next; }));
    checkDupes();
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const d = readForm(form);
      if (!d.firstName && !d.lastName && !d.company) { U.toast('Add at least a name or company', 'err'); return; }
      const lead = existing || draft;
      const prevStatus = lead.status;
      const prevEmailStatus = lead.emailStatus;
      Object.assign(lead, d);
      lead.status = prevStatus;
      if (d.emailStatus !== 'Unverified' && d.emailStatus !== prevEmailStatus) PV.stamp(lead, 'verified');
      S.saveLead(lead, { silent: true });
      if (d.status !== prevStatus) PV.setStatus(lead.id, d.status, { silent: true });
      U.closeModal();
      U.toast(existing ? 'Lead saved' : 'Lead added');
      if (!existing && submitter === 'another') { PV.render(); PV.openLeadForm(); return; }
      if (!existing && submitter === 'research') { PV.go('#/research/' + lead.id); return; }
      PV.render();
    });
  };

  Object.assign(PV.actions, {
    'add-lead': () => PV.openLeadForm(),
    'edit-lead': (el) => PV.openLeadForm(el.dataset.id),
    'close-modal-go': (el) => { U.closeModal(); PV.go(el.dataset.href); },
    'delete-lead': (el) => {
      const l = S.lead(el.dataset.id);
      U.confirmBox('Delete lead?', `${PV.leadName(l)} at ${l.company} and all research and drafts will be removed.`, 'Delete', () => {
        S.deleteLead(l.id); U.closeModal(); U.toast('Lead deleted'); PV.go('#/leads');
      }, true);
    }
  });

  /* ---------------- Lead database ---------------- */

  const DEFAULT_FILTERS = { q: '', industry: '', location: '', title: '', score: '', status: '', emailStatus: '', added: '', followup: '' };
  const COLS = [
    ['name', 'Name'], ['company', 'Company'], ['title', 'Role'], ['industry', 'Industry'], ['location', 'Location'], ['score', 'Lead Score'],
    ['status', 'Status'], ['emailStatus', 'Email Status'], ['research', 'Research Status'], ['sent', 'Email Sent'], ['linkedin', 'LinkedIn Status'],
    ['activity', 'Last Activity'], ['next', 'Next Follow-up']
  ];

  function rows() {
    const today = PV.today();
    return PV.leads.map((l) => {
      const sc = PV.score(l);
      const fu = E.nextFollowUp(l, PV.settings);
      return { l, sc, fu, name: PV.leadName(l), research: E.researchStatus(l), li: E.linkedinStatus(l),
        last: (l.activity && l.activity.length ? l.activity[l.activity.length - 1].at : l.updatedAt), due: fu ? fu.due : '', overdue: fu && fu.due <= today };
    });
  }

  function applyFilters(list, f) {
    const today = PV.today();
    const q = f.q.toLowerCase();
    return list.filter((r) => {
      const l = r.l;
      if (q && ![r.name, l.company, l.title, l.email, l.location, l.industry].join(' ').toLowerCase().includes(q)) return false;
      if (f.industry && l.industry !== f.industry) return false;
      if (f.location && !(l.location || '').toLowerCase().includes(f.location.toLowerCase())) return false;
      if (f.title && !(l.title || '').toLowerCase().includes(f.title.toLowerCase())) return false;
      if (f.score && r.sc.priority.key !== f.score) return false;
      if (f.status && l.status !== f.status) return false;
      if (f.emailStatus && (l.emailStatus || 'Unverified') !== f.emailStatus) return false;
      if (f.added) {
        const k = E.dayKey(l.milestones.added || l.createdAt);
        if (f.added === 'today' && k !== today) return false;
        if (f.added === '7' && k < E.dayKey(E.addDays(new Date(), -6))) return false;
        if (f.added === '30' && k < E.dayKey(E.addDays(new Date(), -29))) return false;
      }
      if (f.followup === 'due' && !r.overdue) return false;
      if (f.followup === 'upcoming' && !(r.fu && !r.overdue)) return false;
      if (f.followup === 'none' && r.fu) return false;
      return true;
    });
  }

  function sortRows(list, key, dir) {
    const val = (r) => ({ name: r.name, company: r.l.company, title: r.l.title, industry: r.l.industry, location: r.l.location, score: r.sc.total,
      status: E.STAGE_BY_KEY[r.l.status].index, emailStatus: r.l.emailStatus, research: r.research, sent: r.l.milestones.sent || '', linkedin: r.li,
      activity: r.last || '', next: r.due || '9999' }[key]);
    return list.slice().sort((a, b) => {
      const x = val(a), y = val(b);
      const c = typeof x === 'number' ? x - y : String(x || '').localeCompare(String(y || ''));
      return dir === 'desc' ? -c : c;
    });
  }

  PV.views.leads = {
    render(r) {
      const f = Object.assign({}, DEFAULT_FILTERS, PV.prefs.leadFilters || {}, r.params || {});
      const sort = PV.prefs.leadSort || { key: 'activity', dir: 'desc' };
      const all = rows();
      const list = sortRows(applyFilters(all, f), sort.key, sort.dir);
      PV._leadList = list;
      const distinct = (fn) => Array.from(new Set(PV.leads.map(fn).filter(Boolean))).sort();
      const cities = distinct((l) => (l.location || '').split(',')[0].trim());
      const sel = (key, label, options) => html`<select class="select sm" data-filter="${key}" aria-label="${label}"><option value="">${label}</option>${options.map(([v, t]) => opt(v, f[key], t))}</select>`;
      const active = Object.keys(DEFAULT_FILTERS).some((k) => f[k]);
      return html`
        <div class="page-head"><div><h1>Leads</h1><p class="sub">${PV.leads.length} leads in the database. Click a row to open it.</p></div>
          <div class="actions"><button class="btn" data-action="export-csv">${icon('download')}Export CSV</button><button class="btn primary" data-action="add-lead">${icon('plus')}Add lead</button></div></div>
        <div class="card">
          <div class="filters">
            <div class="search" style="flex:1;min-width:200px">${icon('search')}<input class="input sm" data-filter="q" placeholder="Search name, company, email…" value="${f.q}" aria-label="Search leads"></div>
            ${sel('industry', 'Industry', distinct((l) => l.industry).map((v) => [v, v]))}
            ${sel('location', 'Location', cities.map((v) => [v, v]))}
            <input class="input sm" data-filter="title" placeholder="Job title" value="${f.title}" style="width:130px" aria-label="Job title">
            ${sel('score', 'Lead score', [['high', 'High (80+)'], ['medium', 'Medium (60–79)'], ['low', 'Low (<60)']])}
            ${sel('status', 'Status', E.STAGES.map((s) => [s.key, s.label]))}
            ${sel('emailStatus', 'Email status', E.EMAIL_STATUSES.map((s) => [s, s]))}
            ${sel('added', 'Date added', [['today', 'Today'], ['7', 'Last 7 days'], ['30', 'Last 30 days']])}
            ${sel('followup', 'Follow-up', [['due', 'Due / overdue'], ['upcoming', 'Upcoming'], ['none', 'None scheduled']])}
            ${active ? html`<button class="btn sm ghost" data-action="clear-filters">Clear</button>` : ''}
          </div>
          <div class="table-wrap"><table class="t compact"><thead><tr>${COLS.map(([k, t]) => html`<th class="sortable" data-action="sort" data-key="${k}">${t}${sort.key === k ? (sort.dir === 'asc' ? ' ↑' : ' ↓') : ''}</th>`)}</tr></thead>
          <tbody>${list.map((x) => html`<tr data-href="#/lead/${x.l.id}">
            <td class="nowrap"><b>${x.name}</b></td><td>${x.l.company}</td><td>${x.l.title}</td><td class="nowrap">${x.l.industry}</td><td class="nowrap">${x.l.location}</td>
            <td>${U.scoreBadge(x.sc)}</td><td>${U.statusBadge(x.l.status)}</td><td>${U.emailBadge(x.l.emailStatus)}</td>
            <td><span class="badge ${x.research === 'Complete' ? 'b-green' : x.research === 'In progress' ? 'b-blue' : ''}">${x.research}</span></td>
            <td class="nowrap">${x.l.milestones.sent ? U.shortDate(x.l.milestones.sent) : html`<span class="faint">—</span>`}</td>
            <td class="nowrap">${x.li}</td><td class="nowrap muted">${U.ago(x.last)}</td>
            <td class="nowrap">${x.fu ? html`<span class="badge ${x.overdue ? 'b-coral' : ''}">${U.dueLabel(x.fu.due)}</span>` : html`<span class="faint">—</span>`}</td>
          </tr>`)}</tbody></table></div>
          ${list.length ? '' : html`<div class="empty"><h3>No leads match</h3><p>Try clearing a filter.</p></div>`}
        </div>`;
    },
    mount(root) {
      root.querySelectorAll('[data-filter]').forEach((el) => {
        const ev = el.tagName === 'INPUT' ? 'input' : 'change';
        el.addEventListener(ev, () => {
          PV.prefs.leadFilters = Object.assign({}, PV.prefs.leadFilters, { [el.dataset.filter]: el.value });
          PV.savePrefs();
          clearTimeout(PV._ft);
          PV._ft = setTimeout(() => {
            const pos = el.selectionStart;
            if (location.hash.includes('?')) { history.replaceState(null, '', '#/leads'); }
            PV.render();
            const again = document.querySelector(`[data-filter="${el.dataset.filter}"]`);
            if (again && el.tagName === 'INPUT') { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } }
          }, el.tagName === 'INPUT' ? 180 : 0);
        });
      });
    }
  };

  Object.assign(PV.actions, {
    'sort': (el) => {
      const cur = PV.prefs.leadSort || {};
      PV.prefs.leadSort = { key: el.dataset.key, dir: cur.key === el.dataset.key && cur.dir === 'desc' ? 'asc' : 'desc' };
      PV.savePrefs(); PV.render();
    },
    'clear-filters': () => { PV.prefs.leadFilters = {}; PV.savePrefs(); history.replaceState(null, '', '#/leads'); PV.render(); },
    'export-csv': () => {
      const list = PV._leadList || rows();
      const head = ['First Name', 'Last Name', 'Job Title', 'Company', 'Company Website', 'LinkedIn URL', 'Location', 'Industry', 'Company Size', 'Email', 'Email Source', 'Email Verification Status', 'Lead Score', 'Priority', 'Status', 'Research Status', 'Email Sent', 'LinkedIn Status', 'Next Follow-up', 'Research Notes'];
      const data = list.map((x) => [x.l.firstName, x.l.lastName, x.l.title, x.l.company, x.l.website, x.l.linkedin, x.l.location, x.l.industry, x.l.companySize, x.l.email, x.l.emailSource, x.l.emailStatus, x.sc.total, x.sc.priority.label, E.STAGE_BY_KEY[x.l.status].label, x.research, x.l.milestones.sent ? E.dayKey(x.l.milestones.sent) : '', x.li, x.due, x.l.notes]);
      U.download(`point-vision-leads-${PV.today()}.csv`, E.toCSV([head].concat(data)), 'text/csv');
    }
  });

  /* ---------------- Lead detail ---------------- */

  const CHECKS = [
    ['emailSent', 'Email sent'], ['profileReviewed', 'LinkedIn profile reviewed'], ['requestSent', 'Connection request sent'],
    ['connected', 'Connected'], ['replied', 'Replied'], ['followupRequired', 'Follow-up required']
  ];

  function copyBlock(id, text, label) {
    return html`<div class="copybox" id="${id}">${text}</div><div class="row"><button class="btn sm" data-action="copy" data-from="#${id}" data-label="${label || 'Message'}">${icon('copy')}Copy</button></div>`;
  }
  PV.copyBlock = copyBlock;

  function outboundCard(l) {
    const st = E.STAGE_BY_KEY[l.status].index;
    const approvedIdx = E.STAGE_BY_KEY.approved.index;
    if (st < approvedIdx) {
      const step = E.nextStep(l);
      return html`<div class="card"><div class="card-h"><h2>Outbound</h2></div><div class="card-b"><p class="muted">Not approved yet. Nothing is sent from here until a founder approves it.</p>
        <p class="mt-sm"><span class="strong">Next step:</span> ${step.label}</p></div></div>`;
    }
    const o = l.outreach || {};
    if (l.status === 'approved') {
      return html`<div class="card"><div class="card-h"><h2>Ready to send</h2><span class="badge b-green">Approved</span></div>
        <div class="card-b stack-sm"><div class="small muted">To: ${l.email || 'no email on file'} · Subject: <b>${o.subject || ''}</b></div>
        ${copyBlock('send-body', o.body || '', 'Email')}
        <p class="tiny muted">Send it yourself from your inbox, then click Email Sent. Follow-up reminders start from that moment.</p>
        <div class="btn-row">${PV.mailtoBtn(l)}<button class="btn dark" data-action="mark-sent" data-id="${l.id}">${icon('send')}Email Sent</button></div></div></div>`;
    }
    const c = l.linkedinChecklist || {};
    const done = CHECKS.filter(([k]) => c[k]).length;
    return html`<div class="card"><div class="card-h"><h2>LinkedIn Follow-up</h2><span class="sub">Manual only. Nothing is automated on LinkedIn</span>
        <div class="right">${l.linkedin ? html`<a class="btn sm dark" href="${l.linkedin}" target="_blank" rel="noopener">${icon('linkedin')}Open LinkedIn</a>` : ''}</div></div>
      <div class="card-b">
        <div class="checklist-progress mb"><div class="progress green" style="flex:1"><i style="width:${Math.round(done * 100 / CHECKS.length)}%"></i></div><span class="small strong">${done} / ${CHECKS.length}</span></div>
        ${CHECKS.map(([k, t]) => html`<label class="check ${c[k] ? 'done' : ''}"><input type="checkbox" data-action="li-check" data-id="${l.id}" data-key="${k}" ${c[k] ? 'checked' : ''}><span class="t">${t}</span>
          ${k === 'emailSent' && l.milestones.sent ? html`<span class="tiny muted" style="margin-left:auto">${U.shortDate(l.milestones.sent)}</span>` : ''}</label>`)}
      </div></div>`;
  }

  function responseCard(l) {
    if (!l.milestones.sent) return '';
    const btn = (to, label, cls) => html`<button class="btn sm ${l.status === to ? 'dark' : cls || ''}" data-action="status" data-id="${l.id}" data-to="${to}">${label}</button>`;
    return html`<div class="card"><div class="card-h"><h2>Track response</h2><span class="sub">Log what happened. This feeds the analytics</span></div>
      <div class="card-b btn-row">${btn('replied', 'Replied')}${btn('positive', 'Positive reply')}${btn('meeting', 'Meeting booked')}${btn('qualified', 'Qualified')}${btn('proposal', 'Proposal')}${btn('won', 'Won')}${btn('notInterested', 'Not interested', 'danger')}${btn('lost', 'Lost', 'danger')}</div></div>`;
  }

  function linkedinCard(l) {
    const p = E.linkedinPlan(l, PV.settings);
    const connected = (l.linkedinChecklist || {}).connected;
    return html`<div class="card"><div class="card-h"><h2>LinkedIn strategy</h2></div><div class="card-b stack-sm">
      <div class="small"><span class="strong">Recommended:</span> ${p.recommended}</div>
      <div class="lbl-sm mt-sm">Optional connection note</div>${copyBlock('li-note', p.note, 'Connection note')}
      <details class="more" ${connected ? 'open' : ''}><summary>After they accept${connected ? '' : ' (use once connected)'}</summary>
        <div class="stack-sm mt-sm">
          <div class="lbl-sm">1 · First follow-up</div>${copyBlock('li-1', p.afterAccept.firstFollowUp)}
          <div class="lbl-sm">2 · Conversation starter</div>${copyBlock('li-2', p.afterAccept.conversationStarter)}
          <div class="lbl-sm">3 · Value-led follow-up</div>${copyBlock('li-3', p.afterAccept.valueFollowUp)}
          <p class="tiny muted">Hold off on pitching Point Vision until they show interest.</p>
        </div></details>
    </div></div>`;
  }

  function followupCard(l) {
    if (!l.milestones.sent) return '';
    const plan = E.followUpPlan(l, PV.settings);
    const stopped = E.STOP_FOLLOWUPS.includes(l.status) || l.milestones.replied;
    const today = PV.today();
    return html`<div class="card"><div class="card-h"><h2>Follow-ups</h2><span class="sub">${stopped ? 'Stopped: they responded or the lead is closed' : 'Reminders only. Send each one yourself'}</span></div>
      <div class="list">${plan.map((f) => html`<div class="li" style="align-items:flex-start"><div class="grow">
        <div class="row wrap"><span class="ttl">Follow-up ${f.n} · Day ${f.day}</span><span class="small muted">${f.label}</span>
          <span style="margin-left:auto">${f.doneAt ? html`<span class="badge b-green">Sent ${U.shortDate(f.doneAt)}</span>` : f.skipped ? html`<span class="badge">Skipped</span>` : stopped ? '' : html`<span class="badge ${f.due <= today ? 'b-coral' : ''}">${U.dueLabel(f.due)} · ${U.shortDate(f.due)}</span>`}</span></div>
        ${f.doneAt || f.skipped || stopped ? '' : html`<div class="mt-sm">${copyBlock('fu-' + f.n, f.body, 'Follow-up')}<div class="btn-row mt-sm">${PV.mailtoBtn(l, f.subject, f.body)}<button class="btn sm dark" data-action="fu-done" data-id="${l.id}" data-n="${f.n}">${icon('check')}Mark sent</button><button class="btn sm ghost" data-action="fu-skip" data-id="${l.id}" data-n="${f.n}">Skip</button></div></div>`}
      </div></div>`)}</div></div>`;
  }

  PV.followupCard = followupCard;

  PV.views.lead = {
    render(r) {
      const l = S.lead(r.id);
      if (!l) return html`<div class="card"><div class="empty"><h3>Lead not found</h3><p><a href="#/leads">Back to leads</a></p></div></div>`;
      const sc = PV.score(l);
      const opps = E.analyze(l, PV.settings);
      const rs = l.research || {};
      return html`
        <div class="page-head" style="align-items:center">
          <span class="avatar" style="width:44px;height:44px;font-size:15px">${U.initials(l)}</span>
          <div><h1>${PV.leadName(l)}</h1><p class="sub">${l.title || 'No title'} at <b>${l.company || 'No company'}</b> · ${l.location || 'No location'}</p></div>
          <div class="actions">
            <select class="select" data-onchange="status-select" data-id="${l.id}" aria-label="Lead status" style="width:auto">${E.STAGES.map((s) => opt(s.key, l.status, s.label))}</select>
            <button class="btn" data-action="edit-lead" data-id="${l.id}">${icon('edit')}Edit</button>
            <a class="btn" href="#/research/${l.id}">${icon('research')}Research</a>
            <a class="btn" href="#/email/${l.id}">${icon('mail')}Email</a>
            ${l.linkedin ? html`<a class="btn" href="${l.linkedin}" target="_blank" rel="noopener">${icon('linkedin')}LinkedIn</a>` : ''}
          </div>
        </div>
        ${l.founderNote && !l.founderNoteResolved ? html`<div class="banner" style="border-color:#fecaca;background:var(--red-soft)"><b>Founder feedback:</b> ${l.founderNote}<span class="x"><button class="btn sm" data-action="resolve-note" data-id="${l.id}">Mark fixed</button></span></div>` : ''}
        <div class="grid g-main-wide">
          <div class="stack">
            ${outboundCard(l)}
            ${responseCard(l)}
            ${followupCard(l)}
            ${linkedinCard(l)}
            ${l.outreach ? html`<div class="card"><div class="card-h"><h2>Email</h2><span class="sub">Version ${l.outreach.variant || '—'} · ${l.outreach.subject}</span><div class="right"><a class="btn sm" href="#/email/${l.id}">Open in generator</a></div></div><div class="card-b"><div class="preview">${l.outreach.body}</div></div></div>` : ''}
          </div>
          <div class="stack">
            <div class="card"><div class="card-h"><h2>Lead score</h2><div class="right">${U.scoreBadge(sc, true)}</div></div><div class="card-b" data-live="score-parts" data-id="${l.id}">${PV.live['score-parts']({ dataset: { id: l.id } })}</div></div>
            <div class="card"><div class="card-h"><h2>Details</h2></div><div class="card-b"><dl class="kv">
              <dt>Email</dt><dd>${l.email || U.notFound('')} ${U.emailBadge(l.emailStatus)}</dd>
              <dt>Email source</dt><dd>${U.notFound(l.emailSource)}</dd>
              <dt>Industry</dt><dd>${U.notFound(l.industry)}</dd><dt>Company size</dt><dd>${U.notFound(l.companySize)}</dd>
              <dt>Website</dt><dd>${l.website ? html`<a href="${l.website}" target="_blank" rel="noopener">${l.website.replace(/^https?:\/\//, '')}</a>` : U.notFound('')}</dd>
              <dt>LinkedIn</dt><dd>${l.linkedin ? html`<a href="${l.linkedin}" target="_blank" rel="noopener">Profile</a>` : U.notFound('')}</dd>
              <dt>Notes</dt><dd>${U.notFound(l.notes)}</dd>
            </dl></div></div>
            <div class="card"><div class="card-h"><h2>Research summary</h2><div class="right"><span class="badge">${E.researchStatus(l)}</span></div></div><div class="card-b stack-sm">
              <div class="small">${U.notFound(rs.description)}</div>
              ${opps.slice(0, 3).map((o) => html`<div class="opp"><div class="ln"><span class="tag fact">Fact</span>${o.fact}</div><div class="ln"><span class="tag hypothesis">Hypothesis</span>${o.opportunity}</div><div class="src mt-sm">${o.fieldLabel} · ${o.confidence} confidence</div></div>`)}
              ${opps.length ? '' : html`<p class="small muted">No signals recorded yet.</p>`}
            </div></div>
            <div class="card"><div class="card-h"><h2>Activity</h2></div><div class="card-b"><div class="timeline">${(l.activity || []).slice().reverse().map((a) => html`<div class="ev"><span class="when">${new Date(a.at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span><span>${a.text}</span></div>`)}</div></div></div>
          </div>
        </div>`;
    }
  };

  Object.assign(PV.actions, {
    'status-select': (el) => { PV.setStatus(el.dataset.id, el.value); U.toast('Status updated'); },
    'li-check': (el, ev) => {
      const key = el.dataset.key;
      PV.mutate(el.dataset.id, (l) => {
        l.linkedinChecklist[key] = el.checked;
        if (el.checked) {
          if (key === 'requestSent') PV.stamp(l, 'linkedinRequested');
          if (key === 'connected') { PV.stamp(l, 'linkedinRequested'); l.linkedinChecklist.requestSent = true; PV.stamp(l, 'connected'); if (l.status === 'sent') l.status = 'connected'; }
          if (key === 'replied') { PV.stamp(l, 'replied'); if (['sent', 'connected'].includes(l.status)) l.status = 'replied'; }
          if (key === 'emailSent') PV.stamp(l, 'sent');
          if (key === 'profileReviewed') PV.log(l, 'LinkedIn profile reviewed');
          if (key === 'followupRequired') PV.log(l, 'Flagged: follow-up required');
        }
      });
    },
    'fu-done': (el) => { PV.mutate(el.dataset.id, (l) => { l.followups[el.dataset.n] = { doneAt: new Date().toISOString() }; PV.log(l, `Follow-up ${el.dataset.n} sent (manually)`); }); U.toast('Follow-up logged'); },
    'fu-skip': (el) => { PV.mutate(el.dataset.id, (l) => { l.followups[el.dataset.n] = { skipped: true, at: new Date().toISOString() }; PV.log(l, `Follow-up ${el.dataset.n} skipped`); }); },
    'resolve-note': (el) => { PV.mutate(el.dataset.id, (l) => { l.founderNoteResolved = true; PV.log(l, 'Founder feedback addressed'); }); }
  });
})();
</script>
<script>/* Research workspace: paste public facts, see opportunities and score update live. */
(function () {
  'use strict';
  const PV = window.PV, E = PV.E, U = PV.U, S = PV.S;
  const { html, icon } = U;

  // Leads that still need research come first, then by score.
  function pickerList(currentId, filter) {
    const order = { new: 0, researching: 1, researchComplete: 2, drafted: 3, review: 4 };
    return PV.leads
      .filter((l) => filter === 'all' || order[l.status] !== undefined || l.id === currentId)
      .map((l) => ({ l, sc: PV.score(l) }))
      .sort((a, b) => ((order[a.l.status] ?? 9) - (order[b.l.status] ?? 9)) || b.sc.total - a.sc.total);
  }
  PV.pickerList = pickerList;

  PV.picker = (route, currentId, list, filter) => html`<div class="card picker-card">
    <div class="card-h"><h3>Prospects</h3><div class="right"><div class="seg"><button class="${filter !== 'all' ? 'on' : ''}" data-action="picker-filter" data-v="open">Open</button><button class="${filter === 'all' ? 'on' : ''}" data-action="picker-filter" data-v="all">All</button></div></div></div>
    <div class="list picker">${list.map(({ l, sc }) => html`<a class="li ${l.id === currentId ? 'on' : ''}" href="#/${route}/${l.id}">
      <span class="grow"><span class="ttl">${PV.leadName(l)}</span><div class="meta">${l.company} · ${E.STAGE_BY_KEY[l.status].label}</div></span>${U.scoreBadge(sc)}</a>`)}
      ${list.length ? '' : html`<div class="empty small">No open leads.</div>`}
    </div></div>`;
  PV.actions['picker-filter'] = (el) => { PV.prefs.pickerFilter = el.dataset.v; PV.savePrefs(); PV.render(); };

  const g = (q) => 'https://www.google.com/search?q=' + encodeURIComponent(q);

  function quickLinks(l) {
    const c = '"' + (l.company || '') + '"';
    const links = [
      l.website ? ['Website', l.website] : null,
      l.linkedin ? ['LinkedIn profile', l.linkedin] : null,
      ['Company news', g(`${c} (announces OR raises OR launches OR appoints OR partners)`) + '&tbs=qdr:y'],
      ['Job openings', g(`${c} (careers OR jobs OR hiring) (automation OR operations OR engineer)`)],
      ['LinkedIn company page', g(`site:linkedin.com/company ${c}`)],
      ['Interviews / podcasts', g(`"${PV.leadName(l)}" ${c} (interview OR podcast OR panel)`)],
      ['Tech stack mentions', g(`${c} (salesforce OR hubspot OR aws OR azure OR snowflake OR "tech stack")`)]
    ].filter(Boolean);
    return html`<div class="chips">${links.map(([t, u]) => html`<a class="chip" href="${u}" target="_blank" rel="noopener">${t} ${icon('ext')}</a>`)}</div>`;
  }

  function field(l, f) {
    const v = l.research[f.key] || '';
    return html`<div class="field ${f.key === 'description' || f.key === 'products' ? 'full' : ''}"><label for="r-${f.key}">${f.label}</label>
      <textarea class="textarea" id="r-${f.key}" data-f="research.${f.key}" rows="2" placeholder="${f.placeholder || 'Paste what you found, with the date and source. Leave blank if not found.'}">${v}</textarea></div>`;
  }

  function filled(l, sec) {
    return sec.fields.filter((f) => E.has(l.research[f.key])).length;
  }

  // Live panels ------------------------------------------------------------

  PV.live['score-parts'] = (el) => {
    const l = S.lead(el.dataset.id);
    if (!l) return '';
    const sc = PV.score(l);
    return html`<div class="row between mb"><div><div class="strong">${sc.total} / 100</div><div class="tiny muted">${sc.overridden ? `Manual score (calculated ${sc.calculated})` : 'Internal prioritisation only'}</div></div>${U.priorityBadge(sc)}</div>
      <div class="score-parts">${sc.parts.map((p) => html`<div class="p"><span class="lab">${p.label}</span><span class="pts">${Math.round(p.score)} / ${p.max}</span><div class="progress"><i style="width:${Math.round(p.frac * 100)}%"></i></div><span class="why">${p.why}</span></div>`)}</div>`;
  };

  PV.live['opportunities'] = (el) => {
    const l = S.lead(el.dataset.id);
    if (!l) return '';
    const opps = E.analyze(l, PV.settings);
    if (!opps.length) {
      return html`<div class="empty small"><h3>No signals yet</h3><p>Paste observed facts into Recent, Hiring, Technology or Executive signals. Opportunities appear here as you type. Nothing is ever filled in for you.</p></div>`;
    }
    return html`${opps.map((o) => html`<div class="opp">
      <div class="row between" style="margin-bottom:8px"><span class="small strong">${o.ruleName}</span>${U.confBadge(o.confidence)}</div>
      <div class="ln"><span class="tag fact">Fact</span><span class="strong">Observed signal.</span> ${o.fact}</div>
      <div class="ln"><span class="tag inference">Inference</span><span class="strong">Possible business challenge.</span> ${o.challenge}</div>
      <div class="ln"><span class="tag hypothesis">Hypothesis</span><span class="strong">Potential Point Vision opportunity.</span> ${o.opportunity} <span class="muted">(${o.service})</span></div>
      <div class="src mt-sm">Source field: ${o.fieldLabel}${o.corroborated ? ' · corroborated by another signal' : ''}</div>
    </div>`)}`;
  };

  PV.live['hiring-summary'] = (el) => {
    const l = S.lead(el.dataset.id);
    const t = l ? E.hiringText(l.research.hiringRoles) : '';
    return t ? html`<div class="small"><span class="tag fact">Fact</span>${l.company} is hiring ${t}.</div>` : html`<div class="small notfound">Not Found</div>`;
  };

  PV.live['research-progress'] = (el) => {
    const l = S.lead(el.dataset.id);
    const n = E.filledResearchCount(l);
    const sig = E.signalEntries(l).length;
    return html`<span class="badge ${sig ? 'b-green' : ''}">${sig} signal${sig === 1 ? '' : 's'}</span> <span class="badge b-line">${n} field${n === 1 ? '' : 's'} filled</span>`;
  };

  // View --------------------------------------------------------------------

  PV.views.research = {
    render(r) {
      const filter = PV.prefs.pickerFilter || 'open';
      const list = pickerList(r.id, filter);
      const l = r.id ? S.lead(r.id) : (list[0] && list[0].l);
      if (!l) return html`<div class="page-head"><div><h1>Research</h1></div></div><div class="card"><div class="empty"><h3>No leads to research</h3><p>Add a lead first.</p><button class="btn primary mt" data-action="add-lead">Add lead</button></div></div>`;
      if (!r.id) history.replaceState(null, '', '#/research/' + l.id);
      const hasSignal = E.signalEntries(l).length > 0;
      const done = !!l.milestones.researched;
      return html`
        <div class="page-head"><div><h1>Research</h1><p class="sub">Paste publicly available information only. If you cannot verify something, leave it blank: it shows as <span class="notfound">Not Found</span>, and nothing is invented to fill the gap.</p></div></div>
        <div class="grid g-work">
          ${PV.picker('research', l.id, list, filter)}
          <div class="card" data-lead="${l.id}">
            <div class="card-h">${PV.whoLine(l)}<div class="right" data-live="research-progress" data-id="${l.id}">${PV.live['research-progress']({ dataset: { id: l.id } })}</div></div>
            ${l.founderNote && !l.founderNoteResolved ? html`<div class="card-b" style="background:var(--red-soft);color:var(--red)"><b>Founder feedback:</b> ${l.founderNote} <button class="btn sm" data-action="resolve-note" data-id="${l.id}">Mark fixed</button></div>` : ''}
            <div class="card-b" style="border-bottom:1px solid var(--line-2)"><div class="lbl-sm mb" style="margin-bottom:8px">Quick research links (open in a new tab)</div>${quickLinks(l)}</div>
            ${E.RESEARCH.map((sec, i) => html`<div class="rsec">
              <div class="h"><h3>${sec.title}</h3><span class="hint">${sec.hint}</span><span class="filled-count">${filled(l, sec)} / ${sec.fields.length}</span></div>
              ${i === 0 ? html`<div class="form" style="padding-bottom:0"><dl class="kv full"><dt>Industry</dt><dd>${U.notFound(l.industry)}</dd><dt>Location</dt><dd>${U.notFound(l.location)}</dd><dt>Company size</dt><dd>${U.notFound(l.companySize)} <button class="btn sm ghost" data-action="edit-lead" data-id="${l.id}">Edit</button></dd></dl></div>` : ''}
              <div class="form">${sec.fields.map((f) => field(l, f))}</div>
              ${sec.section === 'signals' ? html`<div class="rsec"><div class="h"><h3>Hiring Signals</h3><span class="hint">Relevant open roles you saw on their careers page or a job board.</span></div>
                <div style="padding:8px 18px 16px">
                  ${(l.research.hiringRoles || []).map((h, j) => html`<div class="hiring-row">
                    <input class="input sm" data-f="research.hiringRoles.${j}.role" value="${h.role}" placeholder="Role, e.g. Automation Engineer" aria-label="Role">
                    <input class="input sm" data-f="research.hiringRoles.${j}.count" value="${h.count}" placeholder="#" aria-label="How many">
