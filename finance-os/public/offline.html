<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173F32">
<title>Offline · Diwani Parivaar OS</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5F1E8; color: #171817; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: #fff; border: 1px solid #e2dcc9; border-radius: 16px; padding: 32px 28px; max-width: 420px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 28px; margin: 18px 0 8px; }
  p { color: #55605a; line-height: 1.5; margin: 0 0 22px; font-size: 15px; }
  button { background: #173F32; color: #fff; border: 0; border-radius: 9px; padding: 11px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="Diwani Parivaar OS">
    <h1>You're offline</h1>
    <p>The OS needs an internet connection to show your latest numbers, leads and payments. Nothing is lost: check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
