# Supabase CLI project config (local development).
# Only the settings this app depends on are listed. `supabase init` defaults apply to the rest.
project_id = "gbs-finance-os"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 16

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
