<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBS Engagement Engine Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: the real app's shell in the GBS brand — green dotted sidebar with the badge and wordmark, cream workspace, outlined cards with hard green shadows, pill buttons. The brand is a light identity, so the demo commits to it in every theme. */
:root {
  color-scheme: light;
  --bg: #fff2dc; --surface: #fffaf0; --surface-2: #ffffff; --sunken: #fbecd2;
  --line: rgba(25, 97, 68, .16); --line-strong: #196144;
  --ink: #191816; --ink-2: #4a4639; --ink-3: #7a7360;
  --brand: #196144; --brand-ink: #fff2dc; --brand-soft: #e3eee4;
  --accent: #ffb933; --accent-deep: #ff9600; --accent-ink: #0f3d2b; --accent-soft: #ffe7b8; --accent-text: #7a4600;
  --sidebar: #196144; --sidebar-2: #12503a; --sidebar-ink: #fff2dc; --sidebar-ink-2: #b9d1c2;
  --good: #16804f; --good-soft: #dcefe2; --warn: #8a5300; --warn-soft: #ffe9c2;
  --bad: #b42318; --bad-soft: #fde4df; --info: #2a6fd6; --info-soft: #e3ecfb;
  --series-1: #16804f; --series-2: #ee8a00; --series-3: #2a6fd6;
  --overlay: rgba(15, 61, 43, .55);
  --hard: 4px 5px 0 rgba(25, 97, 68, .9); --hard-sm: 3px 3px 0 rgba(25, 97, 68, .9); --hard-lg: 7px 8px 0 rgba(25, 97, 68, .9);
  --display: "Bunga", "Alfa Slab One", "Cooper Black", Georgia, serif;
  --font: "Neue Leiden", "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.tab { font-variant-numeric: tabular-nums; }
a { color: var(--brand); }

/* demo ribbon */
.ribbon { background: var(--accent); color: var(--accent-ink); font-size: 12.5px; padding: 6px 16px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; text-align: center; }
.ribbon button { background: rgba(0,0,0,.12); border: 0; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; color: var(--accent-ink); }

/* login */
.login { min-height: calc(100% - 32px); display: grid; grid-template-columns: 1fr 1fr; }
.login .pitch { background: var(--sidebar); color: var(--sidebar-ink); padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.login .pitch h1 { font-size: clamp(26px, 3.2vw, 38px); line-height: 1.15; margin: 0; color: #fff; text-wrap: balance; font-weight: 700; }
.login .pitch p { color: var(--sidebar-ink-2); max-width: 46ch; }
.login .pick { padding: 48px 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.login .pick > div { width: min(100%, 440px); }
.persona { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; margin-top: 10px; }
.persona:hover { border-color: var(--brand); }
.persona .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--brand-soft); color: var(--brand); flex: none; }
.persona b { display: block; font-size: 14px; }
.persona span { font-size: 12.5px; color: var(--ink-3); }
@media (max-width: 820px) { .login { grid-template-columns: 1fr; } .login .pitch { padding: 28px 20px; } }

/* shell */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: calc(100% - 32px); }
aside.side { background: var(--sidebar); color: var(--sidebar-ink); padding: 16px 12px 20px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brandmark { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brandmark .g { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; }
.brandmark b { display: block; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; }
.brandmark span { font-size: 11px; color: var(--sidebar-ink-2); }
.switcher { background: rgba(255,255,255,.06); border-radius: 10px; padding: 8px; }
.switcher .lbl, .navlbl { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--sidebar-ink-2); padding: 0 6px 6px; }
.switcher input { width: 100%; height: 32px; border-radius: 7px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.22); color: var(--sidebar-ink); padding: 0 8px; margin-bottom: 6px; }
.switcher input::placeholder { color: var(--sidebar-ink-2); }
.cl { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 0; background: none; color: var(--sidebar-ink-2); border-radius: 7px; text-align: left; font-size: 13px; }
.cl:hover { background: rgba(255,255,255,.06); color: var(--sidebar-ink); }
.cl.on { background: rgba(255,185,51,.16); color: #fff; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #4cc387; }
.dot.onboarding { background: rgba(255,255,255,.35); }
.cl .n { margin-left: auto; color: var(--accent); font-size: 11.5px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; justify-content: space-between; align-items: center; background: none; border: 0; color: var(--sidebar-ink-2); padding: 7px 10px; border-radius: 8px; font-size: 13px; text-align: left; }
.nav button:hover { background: rgba(255,255,255,.06); color: var(--sidebar-ink); }
.nav button.on { background: var(--sidebar-2); color: #fff; font-weight: 600; }
.pill { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 10.5px; font-weight: 700; padding: 0 6px; line-height: 17px; }
.who { margin-top: auto; background: var(--sidebar-2); border-radius: 10px; padding: 10px 12px; font-size: 12px; }
.who b { display: block; font-size: 13px; color: var(--sidebar-ink); }
.who span { color: var(--sidebar-ink-2); }
.who button { margin-top: 8px; background: none; border: 0; color: var(--sidebar-ink-2); text-decoration: underline; padding: 0; font-size: 12px; }
.top { position: sticky; top: 0; z-index: 20; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); }
.top .ctx { flex: 1; min-width: 0; font-size: 13.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .ctx b { color: var(--ink); }
.iconbtn { position: relative; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn .badge { position: absolute; top: -5px; right: -5px; background: var(--bad); color: #fff; font-size: 10px; border-radius: 999px; min-width: 17px; line-height: 17px; padding: 0 4px; }
.menu { display: none; }
main.page { padding: 24px; max-width: 1360px; width: 100%; }
@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  aside.side { position: fixed; inset: 0 auto 0 0; width: 280px; max-width: 86vw; z-index: 50; transform: translateX(-100%); transition: transform .2s; height: 100%; }
  aside.side.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 40; }
  .menu { display: grid; }
  .top { padding: 0 16px; }
  main.page { padding: 18px 16px 40px; }
}

/* building blocks */
.ph { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.ph h1 { margin: 0; font-size: 23px; letter-spacing: -.01em; text-wrap: balance; }
.ph p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card > .hd { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card > .hd h2 { margin: 0; font-size: 14px; }
.card > .hd p { margin: 2px 0 0; font-size: 12px; color: var(--ink-3); }
.card > .bd { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.g31 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g31 { grid-template-columns: minmax(0, 1fr); } }
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-bottom: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; }
button.stat:hover { border-color: var(--line-strong); }
.stat .l { font-size: 12px; color: var(--ink-3); }
.stat .v { font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .h { font-size: 11.5px; color: var(--ink-3); }
.btn { display: inline-flex; align-items: center; gap: 6px; justify-content: center; height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.sm { height: 29px; padding: 0 10px; font-size: 12px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.badge2 { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--sunken); color: var(--ink-2); }
.t-good { background: var(--good-soft); color: var(--good); }
.t-warn { background: var(--warn-soft); color: var(--warn); }
.t-bad { background: var(--bad-soft); color: var(--bad); }
.t-info { background: var(--info-soft); color: var(--info); }
.t-brand { background: var(--brand-soft); color: var(--brand); }
.t-accent { background: var(--accent-soft); color: var(--accent-text); }
.pf { width: 20px; height: 20px; border-radius: 5px; display: inline-grid; place-items: center; font-weight: 800; font-size: 9px; color: #fff; flex: none; }
.pf.instagram { background: linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af); }
.pf.facebook { background: #1877f2; } .pf.linkedin { background: #0a66c2; } .pf.youtube { background: #e00; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
th { text-align: left; font-size: 11.5px; color: var(--ink-3); font-weight: 600; padding: 9px 14px; border-bottom: 1px solid var(--line); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: middle; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .small { font-size: 12px; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.quote { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; color: var(--ink-2); white-space: pre-line; }
.ctext { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 15px; line-height: 1.55; color: var(--ink); white-space: pre-line; }
textarea, input.inp, select.inp { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 10px; }
input.inp, select.inp { height: 36px; padding-block: 0; }
textarea:focus, input.inp:focus, select.inp:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.notice { border-radius: 8px; padding: 10px 14px; font-size: 13px; border: 1px solid; }
.n-warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.n-info { background: var(--info-soft); color: var(--info); border-color: color-mix(in srgb, var(--info) 22%, transparent); }
.n-good { background: var(--good-soft); color: var(--good); border-color: color-mix(in srgb, var(--good) 25%, transparent); }
.empty { padding: 40px 20px; text-align: center; color: var(--ink-3); }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; font-size: 14px; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 18px; width: 100%; background: none; border: 0; text-align: left; }
button.item:hover { background: var(--surface-2); }
.grow { flex: 1; min-width: 0; }
.bar { height: 6px; border-radius: 999px; background: var(--sunken); }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--series-1); }
.checks { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.issue { font-size: 12px; margin-top: 4px; }
.issue.fail { color: var(--bad); } .issue.warn { color: var(--warn); }

/* approval card */
.acard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.acard.sel { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent); }
.acard .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.acard .body { display: grid; gap: 16px; padding: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 860px) { .acard .body { grid-template-columns: minmax(0, 1fr); } }
.acard .foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 12px 12px; }
.bulkbar { position: sticky; top: 62px; z-index: 10; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(6px); margin-bottom: 14px; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--brand); }

/* modal + toast */
.modal-wrap { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 100; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; width: min(100%, 460px); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal h3 { margin: 0; font-size: 16px; padding: 18px 20px 0; }
.modal .mb { padding: 8px 20px 18px; color: var(--ink-2); }
.modal .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 12px 12px; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 120; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .7s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } aside.side { transition: none; } }
svg text { fill: var(--ink-3); font-size: 11px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ── GBS brand layer ── */
body { font-size: 14.5px; }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 3px solid var(--accent-deep); }
.dots { background-image: radial-gradient(rgba(255,242,220,.09) 1.6px, transparent 1.6px); background-size: 26px 26px; }
.ribbon { background: var(--accent); color: var(--accent-ink); border-bottom: 2px solid var(--brand); font-weight: 500; }
.ribbon button { background: var(--surface); border: 2px solid var(--brand); color: var(--brand); border-radius: 999px; padding: 1px 10px; }
.brandmark { gap: 12px; }
.brandmark img.badge { width: 44px; height: 44px; flex: none; }
.brandmark img.word { height: 22px; width: auto; max-width: 150px; display: block; }
.brandmark .sub { display: block; margin-top: 4px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--accent); }
.switcher { background: rgba(18,80,58,.85); border: 2px solid rgba(255,255,255,.1); border-radius: 16px; }
.switcher input { border-radius: 999px; border-width: 2px; padding: 0 12px; height: 34px; }
.cl.on { background: rgba(255,255,255,.1); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px rgba(255,185,51,.5); }
.switcher .lbl, .navlbl { color: var(--accent); }
.nav button { border-radius: 999px; padding: 7px 12px; font-size: 13.5px; }
.nav button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: 2px 2px 0 rgba(0,0,0,.25); }
.nav button.on .pill { background: var(--brand); color: var(--accent); }
.who { border: 2px solid rgba(255,242,220,.15); border-radius: 16px; }
.top { height: 64px; border-bottom: 2px solid var(--brand); background: color-mix(in srgb, var(--surface) 95%, transparent); }
.top .ctx b { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--brand); }
.iconbtn { width: 40px; height: 40px; border-radius: 999px; border: 2px solid var(--brand); box-shadow: var(--hard-sm); background: var(--surface); }
.iconbtn.menu { background: var(--accent); }
.ph h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 3.4vw, 34px); line-height: 1.05; color: var(--brand); letter-spacing: -.01em; }
.eyebrow { color: #3e5d48; letter-spacing: .12em; }
.card { border: 2px solid var(--brand); border-radius: 20px; box-shadow: var(--hard); overflow: hidden; }
.card > .hd { border-bottom: 2px solid var(--line); }
.card > .hd h2 { color: var(--brand); font-size: 15px; font-weight: 700; }
.stat { border: 2px solid var(--brand); border-radius: 18px; box-shadow: var(--hard-sm); padding: 13px 15px; }
.stat .l { color: var(--ink-2); font-weight: 600; }
.stat .v { font-family: var(--display); font-weight: 400; color: var(--brand); font-size: 30px; line-height: 1.05; margin-top: 4px; }
.press, .btn, button.stat, .persona { transition: transform .16s cubic-bezier(.22,.68,.3,1), box-shadow .16s cubic-bezier(.22,.68,.3,1), background-color .16s; }
.btn { border-radius: 999px; border: 2px solid var(--brand); color: var(--brand); background: var(--surface); box-shadow: var(--hard-sm); height: 38px; padding: 0 18px; font-weight: 600; }
.btn.sm { height: 31px; padding: 0 13px; }
.btn:hover:not([disabled]), button.stat:hover, .persona:hover { transform: translate(-1px, -2px); box-shadow: var(--hard); }
.btn:active:not([disabled]), button.stat:active, .persona:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(25,97,68,.9); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: none; background: #1d6e4e; }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--brand); }
.btn.danger { color: var(--bad); border-color: var(--bad); box-shadow: 3px 3px 0 rgba(180,35,24,.85); }
.btn.ghost { border-color: transparent; box-shadow: none; background: none; color: var(--ink-2); }
.btn.ghost:hover { transform: none; box-shadow: none; background: var(--sunken); color: var(--brand); }
th { background: color-mix(in srgb, var(--sunken) 60%, transparent); color: #3e5d48; text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; border-bottom: 2px solid var(--line); }
textarea, input.inp, select.inp { border: 2px solid rgba(25,97,68,.3); border-radius: 12px; background: var(--surface-2); }
input.inp, select.inp { height: 38px; }
textarea:focus, input.inp:focus, select.inp:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(255,185,51,.4); }
label.f { color: var(--brand); }
.quote { background: color-mix(in srgb, var(--sunken) 70%, transparent); border-radius: 16px; padding: 12px 14px; }
.ctext { border: 2px solid rgba(25,97,68,.2); border-radius: 16px; background: var(--surface-2); padding: 12px 14px; }
.notice { border-width: 2px; border-radius: 16px; }
.acard { border: 2px solid var(--brand); border-radius: 20px; box-shadow: var(--hard); overflow: hidden; }
.acard.sel { border-color: var(--brand); box-shadow: var(--hard), 0 0 0 4px rgba(255,185,51,.6); }
.acard .head { border-bottom: 2px solid var(--line); }
.acard .foot { border-top: 2px solid var(--line); background: color-mix(in srgb, var(--sunken) 50%, transparent); border-radius: 0; }
.bulkbar { top: 72px; border: 2px solid var(--brand); border-radius: 20px; box-shadow: var(--hard-sm); }
.modal { border: 2px solid var(--brand); border-radius: 22px; box-shadow: var(--hard-lg); overflow: hidden; }
.modal h3 { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--brand); }
.modal .mf { border-top: 2px solid var(--line); background: color-mix(in srgb, var(--sunken) 50%, transparent); border-radius: 0; }
.toast { background: var(--brand); color: var(--bg); border: 2px solid var(--accent-ink); border-radius: 999px; padding: 10px 20px; box-shadow: 4px 4px 0 rgba(0,0,0,.25); }
.bar { border: 2px solid var(--brand); height: 12px; background: var(--surface-2); }
.bar > i { background: var(--accent); }
.empty b { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--brand); }
.empty img { width: 48px; height: 48px; margin: 0 auto 8px; display: block; }
/* sign-in */
.login .pitch { background: var(--sidebar); }
.login .pitch .disc { width: 160px; height: 160px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; margin-bottom: 26px; }
.login .pitch .disc img { width: 108px; height: 108px; }
.login .pitch .kick { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; color: var(--accent); margin: 0 0 10px; }
.login .pitch h1 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.02; color: var(--sidebar-ink); }
.login .pitch img.word { height: 34px; width: auto; display: block; }
.login .pick h2 { font-family: var(--display); font-weight: 400; color: var(--brand); font-size: 28px; }
.persona { border: 2px solid var(--brand); border-radius: 18px; box-shadow: var(--hard-sm); background: var(--surface); }
.persona .av { background: var(--accent); color: var(--accent-ink); border: 2px solid var(--brand); font-family: var(--display); font-weight: 400; }
</style>

// ───────────────────────── Quality checks (mirrors src/lib/engine/quality.ts) ─────────────────────────
const GENERIC = ["great post", "nice post", "nice information", "great information", "great content", "love this", "well said", "so true", "amazing post", "thanks for sharing", "very informative", "nice one", "good one", "keep it up", "great list"];
const PROMO = [[/\b(dm|message|inbox) us\b/i, "asks people to DM"], [/\bcheck (out )?our (profile|page|website|site|feed|collection|products?)\b/i, "points to the brand's profile"], [/\b(visit|see) our (website|site|page|store|showroom)\b/i, "asks people to visit the website"], [/\bcontact us\b/i, "says \"contact us\""], [/\blink in (our )?bio\b/i, "mentions link in bio"], [/\b(shop|buy|order|book) now\b/i, "hard sell"], [/\bprices?\b|\bdiscount\b|\b\d{1,2}\s?% off\b|\boffer\b/i, "talks about price or offers"], [/https?:\/\/|www\./i, "contains a link"], [/\bwe make\b/i, "pitches the brand's products"]];
const FAB = [/\bi (once|recently|remember|visited|installed|designed|built)\b/i, /\bmy (client|clients|home|house|family)\b/i, /\bwe (recently |just )?(installed|delivered|completed|fitted) [^.]{0,60}\bfor\b/i];
const STOP = new Set("the a an and or but if of to in on for with at by from is are was were be this that these those it its as your you our we they their there here about into than then so very just can will would should could how what when where which who why not more most much many".split(" "));
const words = (s) => new Set(s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).map((w) => w.replace(/(ing|ed|es|s)$/, "")).filter((w) => w.length > 3 && !STOP.has(w)));
const jacc = (a, b) => { const A = words(a), B = words(b); let i = 0; A.forEach((w) => B.has(w) && i++); return A.size + B.size ? i / (A.size + B.size - i) : 0; };

function quality(text, o, client, selfId) {
  const t = text.trim(), checks = [];
  const pw = words(o.content), cw = words(t); let ov = 0; cw.forEach((w) => pw.has(w) && ov++);
  const kw = client.brand.keywords.some((k) => t.toLowerCase().includes(k.toLowerCase()));
  checks.push(ov === 0 && !kw ? ["relevance", "fail", "Comment doesn't reference anything specific from the post."] : ov < 2 && !kw ? ["relevance", "warn", "Comment only loosely connects to the post."] : ["relevance", "pass", ""]);
  const generic = GENERIC.find((g) => t.toLowerCase().includes(g));
  const spam = []; let spamFail = false;
  if (generic && t.length < 90) { spam.push(`generic praise ("${generic}")`); spamFail = true; } else if (generic) spam.push(`opens with generic praise ("${generic}")`);
  if (t.length < 25) { spam.push("too short to add value"); spamFail = true; }
  if ((t.match(/#\w+/g) || []).length > 3) { spam.push("hashtag stuffing"); spamFail = true; }
  checks.push(spam.length ? ["spam", spamFail ? "fail" : "warn", `Looks spammy: ${spam.join(", ")}.`] : ["spam", "pass", ""]);
  let dup = 0;
  for (const x of DATA.opps) if (x.client === o.client) for (const c of x.comments) if (c.id !== selfId && ["pending_approval", "approved", "queued", "manual_required", "published"].includes(c.status)) dup = Math.max(dup, jacc(c.text, t));
  checks.push(dup >= 0.6 ? ["duplicate", "fail", `${Math.round(dup * 100)}% similar to another ${client.name} comment.`] : ["duplicate", "pass", ""]);
  const avoid = client.brand.avoid.filter((w) => t.toLowerCase().includes(w)); const comp = client.brand.competitors.filter((w) => t.toLowerCase().includes(w.toLowerCase()));
  checks.push(avoid.length || comp.length ? ["brand voice", "fail", `Brand voice: ${[avoid.length && `uses words to avoid (${avoid.join(", ")})`, comp.length && `mentions a competitor (${comp.join(", ")})`].filter(Boolean).join("; ")}.`] : t.length > 360 ? ["brand voice", "warn", `Longer than the preferred ${client.brand.length.toLowerCase()} length.`] : ["brand voice", "pass", ""]);
  const promo = PROMO.filter(([re]) => re.test(t)).map(([, w]) => w);
  checks.push(promo.length ? ["promotional", client.brand.cta === "None" ? "fail" : "warn", `Comment is too promotional: ${promo.join(", ")}.`] : ["promotional", "pass", ""]);
  const claims = client.brand.claims.filter((c) => t.toLowerCase().includes(c.toLowerCase()));
  checks.push(FAB.some((re) => re.test(t)) ? ["safety", "fail", "Describes a personal experience the brand may not have had."] : claims.length ? ["safety", "warn", `Makes a claim that needs approval (${claims.join(", ")}).`] : ["safety", "pass", ""]);
  checks.push(o.platform === "instagram" && /https?:\/\/|www\./i.test(t) ? ["platform policy", "fail", "Links aren't clickable in Instagram comments."] : t.length > (o.platform === "linkedin" ? 1250 : 2200) ? ["platform policy", "fail", "Exceeds the platform's length limit."] : ["platform policy", "pass", ""]);
  const fails = checks.filter((c) => c[1] === "fail").length, warns = checks.filter((c) => c[1] === "warn").length;
  return { score: Math.max(0, 100 - fails * 30 - warns * 8), passed: fails === 0, checks };
}

  bulkAsk() { if (!S.sel.size) return; S.modal = { title: "Confirm approval", body: `You are approving <b>${S.sel.size}</b> comment${S.sel.size === 1 ? "" : "s"} for publication. Only comments that passed every quality check are included.`, ok: `Approve ${S.sel.size}`, act: "bulkGo" }; render(); },
  bulkGo() { let full = 0, part = 0; for (const id of S.sel) { const r = A.approve(id, true); if (r === "full") full++; else if (r === "partial") part++; } S.sel = new Set(); S.modal = null; toast([full && `Approved ${full} for publication.`, part && `Recorded your approval on ${part}; waiting for the other approver.`].filter(Boolean).join(" ")); render(); },
  closeModal() { S.modal = null; render(); },
  queue(cid) { const { o, c } = findComment(cid); c.status = o.capability === "api" ? "queued" : "manual_required"; o.status = "queued"; audit("Queued for publishing", o.client); save(); toast(o.capability === "api" ? "Queued. The worker publishes it through the platform's API." : "Queued. This platform's API can't post here, so it's waiting for someone to post it manually."); render(); },
  process() {
    let n = 0; for (const o of DATA.opps) if (o.client === S.client) for (const c of o.comments) if (c.status === "queued") { c.status = "published"; c.url = "#"; o.status = "published"; n++; note(o.client, `${client(o.client).name}: comment published on ${PLAT[o.platform]}`, c.text.slice(0, 100)); }
    save(); toast(n ? `Published ${n} comment${n === 1 ? "" : "s"} (simulated in this demo).` : "Nothing is due right now."); render();
  },
  posted(cid) { const { o, c } = findComment(cid); const url = document.getElementById(`url-${cid}`)?.value.trim(); if (!/^https?:\/\/\S+/.test(url || "")) return toast("Paste the link to the posted comment first."); c.status = "published"; c.url = url; o.status = "published"; audit("Recorded manual publication", o.client); save(); toast("Recorded as published."); render(); },
  copy(cid) { const { c } = findComment(cid); navigator.clipboard?.writeText(c.text).then(() => toast("Comment copied."), () => toast("Copy isn't available here. Select the text instead.")); },
  dismiss(id) { const o = DATA.opps.find((x) => x.id === id); o.status = "dismissed"; save(); go("opps"); toast("Opportunity dismissed."); },
  filter(v) { S.oppFilter = v; render(); },
  addManual() {
    const g = (i) => document.getElementById(i)?.value.trim() || "";
    const url = g("mi-url"), content = g("mi-text"), author = g("mi-author").replace(/^@/, ""), bio = g("mi-bio"), platform = g("mi-plat") || "instagram";
    if (!/^https?:\/\//.test(url)) return toast("Add the post's link (starting with https://).");
    if (content.length < 15) return toast("Paste what the post says.");
    const cl = client(S.client); const lc = content.toLowerCase();
    const kw = cl.brand.keywords.filter((k) => lc.includes(k.toLowerCase())).length;
    const seg = cl.segments.find((s) => s.titles.some((t) => bio.toLowerCase().includes(t.toLowerCase())));
    const f = { a: seg ? 85 : 35, c: Math.min(100, 10 + kw * 30), v: /\?/.test(content) ? 85 : 40, b: Math.min(100, 15 + kw * 25), au: seg ? 70 : 30, f: 100 };
    const score = Math.round(f.a * .25 + f.c * .25 + f.v * .15 + f.b * .15 + f.au * .1 + f.f * .1);
    const o = { id: `o${++DATA.seq}`, client: S.client, campaign: cl.campaigns[0]?.name || "—", platform, author: author || "unknown", bio, followers: null, ageH: 0, comments_n: 0, content, score, factors: f,
      explanation: `${kw ? "Post mentions campaign keywords" : "Post has limited overlap with campaign keywords"}${seg ? ` and the author matches the ${seg.name} audience` : ""}.`, capability: platform === "youtube" ? "api" : "manual", status: "analyzed", comments: [], gen: 0, manual: true,
      pool: [{ type: "insight", text: `The point about ${firstTerm(content)} is the part people tend to underestimate. Getting it right early shapes how everything else comes together.` }, { type: "conversation", text: `Interesting take on ${firstTerm(content)}. What made you settle on this approach?` }, { type: "expert", text: `From a ${cl.industry.toLowerCase()} point of view, ${firstTerm(content)} decisions work best when they're made alongside proportion and finish, not after.` }] };
    DATA.opps.unshift(o); audit("Added opportunity manually", S.client, url); save(); go("opp", { opp: o.id }); toast(`Added and scored ${score}/100.`);
  },
  read() { DATA.notes.forEach((n) => (n.read = true)); save(); render(); },
};
function firstTerm(s) { const w = s.toLowerCase().replace(/[^a-z\s]/g, " ").split(/\s+/).filter((x) => x.length > 5 && !STOP.has(x)); return w[0] || "this"; }

// ───────────────────────── Charts ─────────────────────────
function series(k) {
  const out = []; const today = new Date();
  for (let i = 13; i >= 0; i--) { const d = new Date(today - i * 864e5); const s = 13 - i; out.push({ d: d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }), opp: Math.round(k * (4 + (s % 5) + s * 0.4)), app: Math.round(k * (2 + (s % 3) + s * 0.2)), pub: Math.round(k * (1 + (s % 3 === 0 ? 2 : 1) + s * 0.15)), rep: Math.round(k * ((s % 4 === 0 ? 2 : 0) + s * 0.08)) }); }
  return out;
}
function chart(data, ser) {
  const W = 640, H = 210, L = 34, R = 12, T = 10, B = 26, iw = W - L - R, ih = H - T - B;
  const max = Math.max(4, ...data.flatMap((d) => ser.map(([k]) => d[k]))); const nice = Math.ceil(max / 4) * 4;
  const x = (i) => L + (i / (data.length - 1)) * iw, y = (v) => T + ih - (v / nice) * ih;
  const grid = [0, nice / 2, nice].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("");
  const xl = data.map((d, i) => (i % 3 === 0 || i === data.length - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${d.d}</text>` : "")).join("");
  const lines = ser.map(([k, , c]) => `<polyline fill="none" stroke="var(${c})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${data.map((d, i) => `${x(i)},${y(d[k])}`).join(" ")}"/>${data.map((d, i) => `<circle cx="${x(i)}" cy="${y(d[k])}" r="${i === data.length - 1 ? 4 : 7}" fill="${i === data.length - 1 ? `var(${c})` : "transparent"}" stroke="${i === data.length - 1 ? "var(--surface)" : "none"}" stroke-width="2"><title>${d.d} · ${ser.find((s) => s[0] === k)[1]}: ${d[k]}</title></circle>`).join("")}`).join("");
  return `<div class="legend">${ser.map(([, l, c]) => `<span><i style="background:var(${c})"></i>${l}</span>`).join("")}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${ser.map((s) => s[1]).join(", ")} per day">${grid}${xl}${lines}</svg>`;
}
